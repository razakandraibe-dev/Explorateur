<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tahiry Lesona MJA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning tool for youth and their leaders: outdoorsy, clear, encouraging
   IDEA a scout's field notebook with four colour-coded tabs: rope, signal lamp, night chart, chalk on laterite
   PICTURE home: night over Tuléar baobabs with the Southern Cross; inside, the live tools (morse grid, star charts, chalk signs)
   COLOUR white or charcoal ground; forest #24573f, signal red #c63d2f, night #13254f, laterite #9a5418
   TYPE Barlow Condensed 700 for titles, Barlow for text (system fallbacks offline)
   LAYOUT one 760px app column, sticky top bar, colour band with pill tabs per section; phone first */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1311);--ink:light-dark(#17201b,#e9eeea);--mut:light-dark(#56635c,#a3aea8);--line:light-dark(#dfe4df,#28322d);--panel:light-dark(#f3f5f2,#171e1b);--ok:light-dark(#1d7a45,#4fc283);--ko:light-dark(#b8322a,#ff7b6e);--green:#24573f;--red:#c63d2f;--night:#13254f;--ochre:#9a5418;--sec:#13254f}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,Roboto,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;font-weight:700;line-height:1.05;letter-spacing:-.01em;margin:0}
button{font-family:inherit}
button:focus-visible,summary:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.app{max-width:760px;margin:0 auto;min-height:100%;background:var(--bg)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--sec);color:#fff}
.top .ttl{flex:1;min-width:0;font-size:clamp(19px,5.6vw,23px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.15);color:#fff;font-size:24px;line-height:1;cursor:pointer}
.lang{flex:none;display:flex;background:rgba(0,0,0,.25);border-radius:12px;padding:3px}
.lang button{min-width:48px;height:38px;border:0;border-radius:9px;background:transparent;color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.lang button[aria-pressed=true]{background:#fff;color:var(--sec)}
.hero{position:relative;background:#081430;color:#fff}
.hero svg{display:block;width:100%;aspect-ratio:2/1}
.hero .txt{position:absolute;left:16px;bottom:14px;right:16px}
.hero h1{font-size:clamp(40px,10vw,56px)}
.hero p{margin:4px 0 0;font-size:16px;color:#d6e0f2}
.tw{animation:tw 3.2s ease-in-out infinite}
.tw:nth-child(2n){animation-delay:1.1s}
@keyframes tw{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.tw{animation:none}}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px}
.tile{border:0;border-radius:18px;padding:14px;color:#fff;min-height:158px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.tile:active{transform:translateY(1px)}
.tile svg{width:46px;height:46px}
.tile h2{font-size:clamp(19px,5.2vw,30px);hyphens:auto;overflow-wrap:break-word}
.tile span{font-size:14px;line-height:1.3;opacity:.92}
.foot{padding:0 16px 24px;color:var(--mut);font-size:14px}
.band{background:var(--sec);color:#fff;padding:4px 16px 16px}
.band h1{font-size:clamp(32px,8vw,44px)}
.band p{margin:4px 0 12px;color:rgba(255,255,255,.88)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{height:44px;padding:0 16px;border-radius:22px;border:1.5px solid rgba(255,255,255,.55);background:transparent;color:#fff;font-weight:600;font-size:16px;cursor:pointer}
.tabs button[aria-selected=true]{background:#fff;color:var(--sec);border-color:#fff}
.wrap{padding:16px 16px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.card h3{font-size:22px;margin-bottom:6px}
.mut{color:var(--mut)}
.small{font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--sec);border-color:var(--sec);color:#fff}
details.fiche{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
details.fiche summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed,sans-serif;font-weight:700;font-size:21px;line-height:1.15}
details.fiche summary::-webkit-details-marker{display:none}
details.fiche summary::after{content:"+";margin-left:auto;font-size:26px;color:var(--sec)}
details.fiche[open] summary::after{content:"−"}
.fb{padding:0 16px 14px}
.fb .use{margin:0 0 8px;color:var(--mut)}
.fb ol{margin:0;padding-left:22px}
.fb li{margin:5px 0}
.lab{font-weight:600;margin:10px 0 2px}
.avoid{border-left:4px solid var(--ko);padding:4px 0 4px 10px;margin-top:10px}
.tip{border-left:4px solid var(--sec);padding:4px 0 4px 10px;margin-top:10px}
.note{background:color-mix(in srgb,var(--sec) 12%,var(--bg));border:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:14px;border:0;background:var(--sec);color:#fff;font-weight:600;font-size:16px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:14px}
.mc{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:8px 6px 9px;text-align:center;cursor:pointer}
.mc b{display:block;font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed,sans-serif;font-size:30px;line-height:1}
.mc .cd{display:block;font-size:20px;letter-spacing:2px;color:var(--sec);font-weight:700;line-height:1.3;white-space:nowrap}
.mc i{display:block;font-style:normal;font-size:13px;color:var(--mut);white-space:nowrap}
:root .mc .cd{color:light-dark(var(--red),#ff8a7a)}
textarea,input[type=text]{width:100%;font:16px/1.4 Barlow,Roboto,sans-serif;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical}
.out{font-size:22px;letter-spacing:2px;word-break:break-word;min-height:34px;font-weight:700;color:light-dark(var(--red),#ff8a7a)}
.outt{font-size:22px;font-weight:600;word-break:break-word;min-height:34px}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.keys button{height:58px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;font-weight:600;cursor:pointer}
.keys .big{font-size:34px;line-height:1;color:var(--red)}
input[type=range]{width:100%;accent-color:var(--red);height:32px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:14px;padding:3px;margin-bottom:12px}
.seg button{flex:1;min-height:42px;border:0;border-radius:10px;background:transparent;color:var(--ink);font-weight:600;font-size:15px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--sec);color:#fff}
.cc{border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;background:var(--panel)}
.sky{background:radial-gradient(120% 90% at 50% 0%,#1d3a72,#0a1531 70%);position:relative}
.sky svg{display:block;width:100%;height:auto}
.cc .ci{padding:12px 16px 14px}
.cc h3{font-size:24px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 8px;font-size:14px;color:var(--mut)}
.meta b{color:var(--ink);font-weight:600}
.rot{position:absolute;right:8px;top:8px;height:40px;padding:0 12px;border-radius:20px;border:1px solid rgba(255,255,255,.4);background:rgba(8,20,48,.55);color:#fff;font-weight:600;font-size:14px;cursor:pointer}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sg{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.board{background:var(--ochre);background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px);background-size:9px 9px;display:grid;place-items:center;aspect-ratio:4/3}
.board svg{width:62%;height:auto}
.sg .si{padding:9px 12px 12px}
.sg h3{font-size:19px;line-height:1.1;margin-bottom:3px}
.sg p{margin:0;font-size:14px;color:var(--mut);line-height:1.35}
.ch{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.cht{fill:#fff;font:700 26px Barlow,Roboto,sans-serif;text-anchor:middle}
.st{fill:#d8d0bf;stroke:#4a2c10;stroke-width:2.5}
.gr{fill:none;stroke:#cdeb98;stroke-width:5;stroke-linecap:round}
.wd{fill:none;stroke:#f3e1bd;stroke-width:8;stroke-linecap:round}
ul.tips{margin:0;padding-left:20px}
ul.tips li{margin:8px 0}
.qbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:4px 0 14px}
.qbar i{display:block;height:100%;background:var(--sec)}
.qq{font-size:22px;font-weight:600;line-height:1.25;margin:4px 0 12px}
.vis{display:grid;place-items:center;margin-bottom:12px;border-radius:16px;overflow:hidden}
.vis.board{aspect-ratio:auto;padding:18px 0}
.vis.board svg{width:150px}
.vis.sky svg{max-width:420px}
.vis .code{font-size:46px;letter-spacing:6px;font-weight:700;color:light-dark(var(--red),#ff8a7a);padding:14px 0}
.playbig{width:96px;height:96px;border-radius:50%;border:0;background:var(--sec);color:#fff;font-size:38px;cursor:pointer;margin:8px 0}
.opts{display:grid;gap:8px}
.opt{min-height:54px;text-align:left;padding:10px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:17px;font-weight:500;cursor:pointer}
.opt.big{text-align:center;font-size:28px;font-weight:700}
.opts.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--bg))}
.opt.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 13%,var(--bg))}
.fbk{margin:12px 0;font-weight:600}
.fbk.ok{color:var(--ok)}
.fbk.ko{color:var(--ko)}
.score{font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed,sans-serif;font-weight:700;font-size:84px;line-height:1;color:var(--sec)}
:root .score{color:light-dark(var(--sec),#fff)}
.grp{font-size:24px;padding:18px 16px 0}
.grid4.g{padding-top:10px}
.tile.wide{grid-column:1/-1;min-height:120px}
.verse{background:color-mix(in srgb,var(--sec) 9%,var(--bg));border-left:5px solid #d9a52b;border-radius:12px;padding:14px 16px;margin-bottom:14px}
.verse .vt{font-size:19px;line-height:1.4;font-weight:500;margin:0 0 6px}
.verse .vr{font-weight:700;color:light-dark(var(--sec),#f2c14e)}
.tlw{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:6px 2px;margin-bottom:14px}
.tlw svg{display:block;width:100%;height:auto}
.tl text{font:600 13px Barlow,Roboto,sans-serif;fill:var(--ink);stroke:var(--bg);stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
.tl .em{fill:light-dark(#6b2140,#f2c14e);font-size:17px;font-weight:700}
.tl .mu{fill:var(--mut);font-weight:500}
.tl .hd{font-weight:700}
.end{background:var(--sec);color:#fff;border-radius:16px;padding:16px;margin-bottom:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:center}
.end .y{font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed,sans-serif;font-weight:700;font-size:clamp(52px,15vw,72px);line-height:.95;color:#f2c14e}
.end p{margin:0}
.calc{font-size:18px;font-weight:600;margin:4px 0}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;margin:0}
.dl dt{font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed,sans-serif;font-weight:700;font-size:20px;line-height:1.2;white-space:nowrap;color:light-dark(var(--sec),#f2c14e)}
.dl dd{margin:0;line-height:1.4}
:root{--pb:light-dark(#1d5c78,#6cc3e0)}
.today{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.today h2{font-size:clamp(26px,7vw,34px)}
.today span{color:var(--mut);font-weight:600;white-space:nowrap}
.pg{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 6px}
.bn{font-weight:600;margin-right:4px}
.chl{display:inline-grid;place-items:center;min-width:40px;height:38px;padding:0 8px;border-radius:10px;border:1.5px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;background:var(--bg)}
.chl:active{background:var(--panel)}
.rd .bn{display:block;font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed,sans-serif;font-size:24px;margin:2px 0 6px}
.rd .chl{min-width:50px;height:46px;font-size:19px;border-color:var(--pb);color:var(--pb)}
.btn.done{background:var(--ok)}
.pct{font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed,sans-serif;font-weight:700;font-size:clamp(48px,14vw,64px);line-height:1;color:var(--pb)}
.stats{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:center}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:6px}
.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.map svg{display:block;width:100%;height:auto}
.map text{font:700 10px Barlow,Roboto,sans-serif;fill:var(--mut)}
.mg6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:12px}
.mg6 .chip{padding:0;width:100%}
.pr{display:grid;grid-template-columns:44px 40px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.pr.now{background:color-mix(in srgb,var(--pb) 10%,var(--bg));border-radius:12px;padding:10px 8px;margin:0 -8px}
.ck{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:transparent;font-size:22px;font-weight:700;cursor:pointer}
.ck.on{background:var(--pb);border-color:var(--pb);color:#fff}
.pd b{display:block;font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed,sans-serif;font-size:24px;line-height:1}
.pd span{font-size:13px;color:var(--mut)}
.rctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.rctl .pill{height:44px;padding:0 16px;border-radius:22px;border:0;background:#fff;color:var(--sec);font-weight:700;font-size:16px;cursor:pointer}
.rctl .sg2{display:flex;background:rgba(0,0,0,.25);border-radius:22px;padding:3px}
.rctl .sg2 button{height:38px;padding:0 12px;border:0;border-radius:19px;background:transparent;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
.rctl .sg2 button[aria-pressed=true]{background:#fff;color:var(--sec)}
.rctl .fs{width:44px;height:44px;border-radius:22px;border:1.5px solid rgba(255,255,255,.55);background:transparent;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.bk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:6px 0 16px}
.bk button{min-height:44px;text-align:left;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer}
.bk button[aria-current=true]{border-color:var(--sec);background:color-mix(in srgb,var(--sec) 12%,var(--bg))}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.cg button{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:17px;cursor:pointer}
.cg button[aria-current=true]{background:var(--sec);border-color:var(--sec);color:#fff}
.txt{line-height:1.6}
.txt .vs{margin:0 0 .45em;white-space:pre-line}
.txt sup{font-size:.62em;font-weight:700;color:light-dark(var(--sec),#e3b27a);margin-right:4px;vertical-align:.45em}
.txt h4{font:600 .82em/1.35 Barlow,Roboto,sans-serif;color:var(--mut);margin:1.1em 0 .35em}
.txt .fn{font-size:.78em;color:var(--mut)}
.rnav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:18px 0}
.rnav .btn{width:100%;padding:0 10px}
.rnav .nx{justify-content:flex-end}
.chl{cursor:pointer;font-size:inherit}
.votd{margin:16px 16px 0;border-radius:18px;padding:16px;background:color-mix(in srgb,#5a3a1c 9%,var(--bg));border:1px solid color-mix(in srgb,#5a3a1c 25%,var(--line))}
.votd .lb{font-size:14px;font-weight:600;color:var(--mut);margin:0 0 6px}
.votd .vt{font-size:19px;line-height:1.45;font-weight:500;margin:0 0 8px}
.votd .vr{font-weight:700;color:light-dark(#5a3a1c,#e3b27a);margin:0 0 12px}
.txt .vs.hl{background:color-mix(in srgb,#f2c14e 30%,transparent);border-radius:6px;box-shadow:0 0 0 4px color-mix(in srgb,#f2c14e 30%,transparent)}
.sbtn{flex:none;width:44px;height:44px;border-radius:22px;border:1.5px solid rgba(255,255,255,.55);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer}
.sbtn[aria-pressed=true]{background:#fff;color:var(--sec);border-color:#fff}
.sr{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:12px 2px;font-size:16px;line-height:1.45;cursor:pointer}
.sr b{display:block;color:light-dark(var(--sec),#e3b27a);font-size:14px;margin-bottom:2px}
.sr mark{background:color-mix(in srgb,#f2c14e 55%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.sform{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:10px}
.sform input{width:100%;font:16px Barlow,Roboto,sans-serif;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;height:46px}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.ref{height:34px;padding:0 10px;border-radius:17px;border:1.5px solid color-mix(in srgb,var(--sec) 45%,var(--line));background:var(--bg);color:light-dark(var(--sec),#c9cdf7);font-weight:600;font-size:14px;cursor:pointer}
.cgh{display:flex;align-items:center;gap:10px;font-size:24px;margin:22px 0 10px}
.cgh span{display:inline-grid;place-items:center;min-width:38px;height:38px;padding:0 6px;border-radius:10px;background:var(--sec);color:#fff;font-size:18px}
.oq{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0 0 6px;font-size:15px}
.oq dt{font-weight:700;color:var(--mut)}
.oq dd{margin:0}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.seg3 button{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;padding:4px}
.seg3 button[aria-pressed=true]{background:var(--sec);border-color:var(--sec);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.kpis div{background:var(--bg);border-radius:12px;padding:8px 2px;border:1px solid var(--line)}
.kpis b{display:block;font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed,sans-serif;font-size:28px;line-height:1;color:light-dark(var(--sec),#c9cdf7)}

{c:"secours",n:{fr:"Étouffement",mg:"Voakenda (zavatra mitsentsina)"},u:{fr:"Quelque chose bloque la gorge : la personne ne peut plus parler, tousser ni respirer.",mg:"Misy zavatra manakana ny tenda : tsy afaka miteny, mikohaka na miaina intsony ilay olona."},
 s:{fr:["Si elle tousse, encourage-la à continuer de tousser.","Sinon : penche-la en avant et donne 5 claques fermes dans le dos, entre les omoplates.","Si ça ne passe pas : place-toi derrière elle, poing fermé au-dessus du nombril, et tire 5 fois vers toi et vers le haut.","Alterne 5 claques et 5 compressions, et fais appeler les secours."],
    mg:["Raha mikohaka izy, ampirisiho hanohy hikohaka.","Raha tsy izany : ampiondrino mankany aloha izy ary kapohy mafy in-5 ny lamosiny, eo anelanelan'ny soroka.","Raha tsy mivoaka : mijoroa ao aoriany, ataovy eo ambonin'ny foitra ny totohondrinao, ary sintony in-5 manatona anao sy miakatra.","Ataovy mifandimby ny kapoka 5 sy ny tsindry 5, ary asaivo miantso mpamonjy."]},
 tip:{fr:"Pour un bébé, les gestes sont différents : apprends-les lors d'une formation.",mg:"Ho an'ny zazakely dia hafa ny fihetsika : ianaro izany amin'ny fiofanana."}},
{c:"secours",n:{fr:"Piqûre de scorpion",mg:"Voatsindron'ny maingoka"},
 s:{fr:["Garde la personne calme et au repos.","Lave la zone à l'eau et au savon.","Applique du froid (linge mouillé).","Va au centre de santé, surtout pour un enfant, si la douleur s'étend, en cas de vomissements ou de gêne pour respirer."],
    mg:["Ampitony sy avelao hiala sasatra ilay olona.","Sasao amin'ny rano sy savony ilay toerana.","Asio zavatra mangatsiaka (lamba lena).","Mankanesa any amin'ny toeram-pitsaboana, indrindra raha ankizy, raha miparitaka ny fanaintainana, mandoa, na sahirana miaina."]},
 a:{fr:["N'incise pas, ne suce pas, ne pose pas de garrot."],mg:["Aza tetehina, aza tsentsefina, aza asiana famehezana mafy (garrot)."]}},
{c:"secours",n:{fr:"Personne inconsciente",mg:"Olona tsy mahatsiaro tena"},
 s:{fr:["Parle-lui et touche ses épaules : est-ce qu'elle répond ?","Regarde pendant 10 secondes si sa poitrine se soulève.","Elle respire : mets-la sur le côté (position latérale de sécurité) et surveille-la.","Elle ne respire pas : fais appeler les secours tout de suite et commence le massage cardiaque si tu l'as appris."],
    mg:["Resaho izy ary tsapao ny sorony : mamaly ve izy ?","Jereo mandritra ny 10 segondra raha miakatra ny tratrany.","Miaina izy : ampandriana mitongilana izy (position latérale de sécurité) ary arahi-maso.","Tsy miaina izy : asaivo miantso avy hatrany ny mpamonjy, ary atombohy ny fanindriana ny tratra (massage cardiaque) raha efa nianatra izany ianao."]}},
{c:"orient",n:{fr:"Les points cardinaux",mg:"Ireo zoro efatra"},
 s:{fr:["Nord (N), Est (E), Sud (S), Ouest (O), dans le sens des aiguilles d'une montre.","Entre eux : Nord-Est, Sud-Est, Sud-Ouest, Nord-Ouest.","En degrés : Nord 0°, Est 90°, Sud 180°, Ouest 270°."],
    mg:["Avaratra (N), Atsinanana (E), Atsimo (S), Andrefana (O), manaraka ny fihodin'ny fanondron'ny famantaranandro.","Eo anelanelany : Avaratra Atsinanana, Atsimo Atsinanana, Atsimo Andrefana, Avaratra Andrefana.","Amin'ny degre : Avaratra 0°, Atsinanana 90°, Atsimo 180°, Andrefana 270°."]}},
{c:"orient",n:{fr:"Utiliser une boussole",mg:"Mampiasa kompasy"},
 s:{fr:["Tiens-la bien à plat devant toi.","Attends que l'aiguille s'arrête : le bout rouge montre le Nord.","Tourne le cadran pour mettre le N sous la pointe rouge.","Lis l'angle de la direction à suivre (l'azimut) et marche vers un repère dans cette direction."],
    mg:["Tazomy fisaka tsara eo anoloanao izy.","Andraso hijanona ny fanjaitra : ny tendrony mena no manondro ny Avaratra.","Ahodino ny takelaka mba ho eo ambanin'ny tendrony mena ny N.","Vakio ny zoron'ny lalana arahina (azimut) ary mandehana mankany amin'ny marika iray amin'io lalana io."]},
 a:{fr:["Éloigne-toi du métal, des téléphones et des voitures : ils font dévier l'aiguille."],mg:["Ialao ny vy, ny finday ary ny fiara : mampiodina ny fanjaitra izy ireo."]}},
{c:"orient",n:{fr:"Le soleil",mg:"Ny masoandro"},
 s:{fr:["Il se lève à l'Est et se couche à l'Ouest.","À Madagascar (hémisphère Sud), à midi il est vers le Nord : ton ombre montre alors le Sud.","À Tuléar, sur le tropique du Capricorne, vers fin décembre le soleil passe presque au-dessus de la tête à midi : la méthode marche mal ces jours-là."],
    mg:["Miposaka any Atsinanana izy ary milentika any Andrefana.","Eto Madagasikara (ilabolantany atsimo), amin'ny mitatao vovonana dia any avaratra izy : ny aloky ny tenanao no manondro ny Atsimo amin'izay.","Eto Toliara, eo amin'ny tropikan'i Capricorne, manodidina ny faran'ny volana Desambra dia saika eo ambonin'ny loha ny masoandro amin'ny mitatao vovonana : tsy dia mandeha tsara io fomba io amin'izany andro izany."]}},
{c:"orient",n:{fr:"La montre à aiguilles",mg:"Ny famantaranandro misy fanondro"},
 s:{fr:["Tiens la montre à plat.","Pointe le 12 vers le soleil.","Le Nord est à mi-chemin entre le 12 et la petite aiguille."],
    mg:["Tazomy fisaka ny famantaranandro.","Atondrohy any amin'ny masoandro ny 12.","Ny Avaratra dia eo antenatenan'ny 12 sy ny fanondro fohy."]},
 tip:{fr:"Cette version est pour l'hémisphère Sud. Dans l'hémisphère Nord, on pointe la petite aiguille vers le soleil.",mg:"Ho an'ny ilabolantany atsimo ity fomba ity. Any amin'ny ilabolantany avaratra, ny fanondro fohy no atondro any amin'ny masoandro."}},
{c:"orient",n:{fr:"La méthode du bâton",mg:"Ny fomba amin'ny tsorakazo"},
 s:{fr:["Plante un bâton bien droit dans un sol plat et dégagé.","Pose une pierre au bout de son ombre.","Attends 15 à 20 minutes et pose une 2e pierre au nouveau bout de l'ombre.","La ligne de la 1re à la 2e pierre va d'Ouest en Est."],
    mg:["Atsatohy amin'ny tany fisaka sy malalaka ny tsorakazo mahitsy tsara.","Apetraho vato iray eo amin'ny tendron'ny alokany.","Miandrasa 15 ka hatramin'ny 20 minitra, ary apetraho vato faharoa eo amin'ny tendron'ny aloka vaovao.","Ny tsipika avy amin'ny vato voalohany mankany amin'ny faharoa dia mandeha avy any Andrefana mankany Atsinanana."]}},
{c:"orient",n:{fr:"La nuit : la Croix du Sud",mg:"Amin'ny alina : ny Lakroan'ny Atsimo"},go:1,
 s:{fr:["Repère la Croix du Sud et ses deux pointeurs.","Prolonge le grand axe de la Croix environ 4 fois et demie.","Descends tout droit jusqu'à l'horizon : c'est le Sud."],
    mg:["Tadiavo ny Lakroan'ny Atsimo sy ireo mpanondro roa.","Halavao in-4 sy sasany eo ho eo ny tsipika lavan'ny Lakroa.","Midina mahitsy hatrany amin'ny faravodilanitra : io no Atsimo."]}},
{c:"camp",n:{fr:"Choisir l'emplacement du camp",mg:"Mifidy ny toerana hitobiana"},
 s:{fr:["Terrain plat et un peu surélevé, pour que l'eau de pluie s'écoule.","Jamais dans le lit d'une rivière à sec ni dans un creux : risque de crue soudaine.","Pas sous un arbre mort ou des branches cassées.","Loin des fourmilières et à l'abri du vent.","Demande l'autorisation au propriétaire ou au fokontany."],
    mg:["Tany fisaka ary somary avo kely, mba hikoriana ny ranon'orana.","Aza ao amin'ny fandehanan'ny renirano maina na amin'ny toerana lalina : mety hisy tondra-drano tampoka.","Aza eo ambanin'ny hazo maty na rantsana tapaka.","Lavitra ny fonenan'ny vitsika ary voaaro amin'ny rivotra.","Angataho alalana amin'ny tompon'ny tany na amin'ny fokontany."]}},
{c:"camp",n:{fr:"Faire un feu en sécurité",mg:"Mandrehitra afo tsy misy loza"},
 s:{fr:["Prépare tout avant d'allumer : herbes sèches et papier, petit bois, bois moyen, grosses bûches.","Feu en tipi (pyramide) : il démarre vite et fait une belle flamme.","Feu en étoile : on pousse les bûches vers le centre au fur et à mesure, il économise le bois.","Dégage le sol autour et entoure le feu de pierres.","Garde un seau d'eau ou de sable à côté.","Pour éteindre : arrose, remue, arrose encore, jusqu'à ce que la cendre soit froide au toucher."],
    mg:["Omano ny zava-drehetra alohan'ny handrehetana : ahitra maina sy taratasy, kitay madinika, kitay salantsalany, vatan-kazo lehibe.","Afo endrika tipi (piramida) : mirehitra haingana izy ary tsara lelafo.","Afo endrika kintana : atosika tsikelikely mankany afovoany ny vatan-kazo, mitsitsy kitay izy.","Diovy ny tany manodidina ary fefeo vato ny afo.","Mitahiry siny misy rano na fasika eo akaiky.","Hamonoana azy : arotsahy rano, kobaho, arotsahy indray, mandra-pangatsiaka ny lavenona rehefa tsapaina."]},
 a:{fr:["Pas de pierres de rivière : chauffées, elles peuvent éclater.","Ne laisse jamais un feu sans surveillance, surtout par vent fort : risque de feu de brousse."],mg:["Aza mampiasa vato avy amin'ny renirano : rehefa mafana dia mety hipoaka.","Aza avela tsy misy mpiambina mihitsy ny afo, indrindra rehefa mahery ny rivotra : mety hisy doro tanety."]}},
{c:"camp",n:{fr:"Rendre l'eau potable",mg:"Manadio ny rano ho azo sotroina"},
 s:{fr:["Laisse reposer l'eau trouble, puis filtre-la dans un tissu propre.","Fais-la bouillir à gros bouillons pendant au moins 1 minute.","Ou traite-la avec une solution chlorée (par exemple Sûr'Eau), en suivant la notice.","Garde-la dans un récipient propre et fermé."],
    mg:["Avelao hitsahatra ny rano maloto, avy eo sivano amin'ny lamba madio.","Andrahoy mangotraka tsara mandritra ny 1 minitra farafahakeliny.","Na asio fanafody klôro (ohatra Sûr'Eau), araka ny torolalana.","Tehirizo ao anaty fitoerana madio sy mihidy."]}},
{c:"camp",n:{fr:"Préparer son sac",mg:"Manomana ny kitapo"},
 s:{fr:["Le plus lourd au fond et contre le dos.","Ce qui sert en route sur le dessus ou dans les poches : gourde, chapeau, vêtement de pluie.","À ne pas oublier : gourde, lampe, petite trousse de secours, couteau (selon la règle du groupe), ficelle, carnet et crayon, Bible.","Règle les bretelles : le poids doit reposer sur les hanches plus que sur les épaules."],
    mg:["Ny mavesatra indrindra any ambany sy manakaiky ny lamosina.","Ny zavatra ilaina an-dalana eo ambony na ao am-paosy : fitoeran-drano, satroka, akanjo fanaovana amin'ny orana.","Aza adino : fitoeran-drano, jiro, kitapom-panafody kely, antsy (araka ny fitsipiky ny vondrona), kofehy, kahie sy pensilihazo, Baiboly.","Ahitsio ny fehin-kitapo : ny valahana no tokony hitondra ny lanja bebe kokoa noho ny soroka."]},
 tip:{fr:"Un sac trop lourd gâche la sortie : n'emporte que l'utile.",mg:"Mahasimba ny dia ny kitapo mavesatra loatra : ny ilaina ihany no entina."}},
{c:"camp",n:{fr:"Ne laisser aucune trace",mg:"Aza mamela soritra"},
 s:{fr:["Rapporte tous tes déchets.","Toilettes : utilise celles qui existent, ou creuse un petit trou à au moins 60 m de l'eau, puis rebouche.","Fais la vaisselle loin des sources et des rivières.","Observe les animaux de loin (lémuriens, oiseaux) et ne cueille pas les plantes rares.","Laisse l'endroit plus propre qu'à ton arrivée."],
    mg:["Ento miverina ny fako rehetra.","Kabone : ampiasao izay efa misy, na mihady lavaka kely 60 m farafahakeliny miala ny rano, dia totofy avy eo.","Manasà vilia lavitra ny loharano sy ny renirano.","Jereo avy lavitra ny biby (gidro, vorona) ary aza mioty ny zavamaniry tsy fahita firy.","Avelao ho madio kokoa noho ny nahatongavanao ilay toerana."]}}

function timelineSvg() {
  const W = 360, H = 350, X0 = 16, X1 = 344, Wd = X1 - X0, f = n => n.toFixed(1);
  const fr = lang === "fr";
  const tx = (x, y, s, a, cl) => `<text x="${f(x)}" y="${f(y)}" text-anchor="${a || "start"}"${cl ? ` class="${cl}"` : ""}>${esc(s)}</text>`;
  const bar = (x, y, w, c) => `<rect x="${f(x)}" y="${y}" width="${f(Math.max(w, 2))}" height="14" fill="${c}"/>`;
  const G = "#d9a52b", LG = "#efcf7f", R = "#c63d2f", WN = "#8e3358";
  const av = y => fr ? y + " av. J.-C." : y + " T.K.", ap = y => fr ? y + " apr. J.-C." : y + " A.K.";
  let o = `<svg viewBox="0 0 ${W} ${H}" class="tl" role="img" aria-label="${esc(t("tlLbl"))}">`;
  /* niveau 1 : les 2300 ans */
  const a1 = X0 + Wd * 490 / 2300;
  o += `<path d="M${X0} 34 V29 H${X1} V34" fill="none" stroke="var(--mut)" stroke-width="1.4"/>` + tx(180, 22, fr ? "2300 soirs et matins = 2300 ans" : "Hariva sy maraina 2300 = taona 2300", "middle", "hd");
  /* zooms (derrière les textes) */
  const L2 = 150, L3 = 252, c0 = X0 + Wd * 483 / 490;
  o += `<path d="M${X0} 66 L${f(a1)} 66 L${X1} ${L2} L${X0} ${L2} Z" fill="${G}" opacity=".13"/>`;
  o += `<path d="M${f(c0)} ${L2 + 14} L${X1} ${L2 + 14} L${X1} ${L3} L${X0} ${L3} Z" fill="${R}" opacity=".11"/>`;
  o += bar(X0, 52, a1 - X0, G) + bar(a1, 52, X1 - a1, WN);
  o += tx((X0 + a1) / 2, 46, fr ? "490 ans" : "taona 490", "middle") + tx((a1 + X1) / 2, 46, fr ? "1810 ans" : "taona 1810", "middle");
  o += tx(X0, 84, av(457)) + tx(X1, 86, "1844", "end", "em") + tx(a1, 101, ap(34), "middle", "mu");
  o += tx(180, 126, fr ? "70 semaines = 490 ans" : "Herinandro 70 = taona 490", "middle", "hd");
  /* niveau 2 : les 70 semaines */
  const b1 = X0 + Wd * 49 / 490;
  o += bar(X0, L2, b1 - X0, LG) + bar(b1, L2, c0 - b1, G) + bar(c0, L2, X1 - c0, R);
  o += tx(X0, L2 - 7, fr ? "7 sem." : "7 herin.") + tx((b1 + c0) / 2, L2 - 7, fr ? "62 semaines" : "herinandro 62", "middle") + tx(X1, L2 - 7, fr ? "1 sem." : "1 herin.", "end");
  o += `<path d="M${f(b1)} ${L2 + 14} V${L2 + 20}" stroke="var(--mut)" stroke-width="1.4"/>`;
  o += tx(X0, L2 + 31, av(457), "start", "mu") + tx(X1 - 2, L2 + 31, ap(27), "end", "mu") + tx(b1, L2 + 48, av(408), "start", "mu");
  o += tx(180, L3 - 26, fr ? "1 semaine = 7 ans" : "Herinandro 1 = taona 7", "middle", "hd");
  /* niveau 3 : la dernière semaine */
  const m = (X0 + X1) / 2;
  o += bar(X0, L3, m - X0, G) + bar(m, L3, X1 - m, R) + `<path d="M${m} ${L3 - 4} V${L3 + 18}" stroke="var(--ink)" stroke-width="2"/>`;
  o += tx((X0 + m) / 2, L3 - 6, fr ? "3 ans ½" : "taona 3 ½", "middle", "mu") + tx((m + X1) / 2, L3 - 6, fr ? "3 ans ½" : "taona 3 ½", "middle", "mu");
  o += tx(X0, L3 + 31, ap(27), "start", "hd") + tx(m, L3 + 31, ap(31), "middle", "hd") + tx(X1, L3 + 31, ap(34), "end", "hd");
  o += tx(X0, L3 + 48, fr ? "Baptême de Jésus" : "Batisan'i Jesosy") + tx(X1, L3 + 48, fr ? "Étienne lapidé" : "Notoraham-bato i Stefana", "end");
  o += tx(m, L3 + 65, fr ? "La croix" : "Ny hazo fijaliana", "middle") + tx(X1, L3 + 82, fr ? "L'Évangile aux nations" : "Filazantsara ho an'ny firenena", "end");
  return o + "</svg>";
}

/* verset du jour : [livre, chapitre, verset, texte malgache 1865, texte Louis Segond 1910] */
const VOTD = [[0,1,1,"Tamin'ny voalohany Andriamanitra nahary ny lanitra sy ny tany.","Au commencement, Dieu créa les cieux et la terre."],[0,1,27,"Ary Andriamanitra nahary ny olona tahaka ny endriny; tahaka ny endrik'Andriamanitra no namoronany azy; lahy sy vavy no namoronany azy.","Dieu créa l’homme à son image, il le créa à l’image de Dieu, il créa l’homme et la femme."],[0,28,15,"Ary, indro, Izaho momba anao ka hiaro anao amin'izay lalan-kalehanao rehetra ary hampody anao indray ho amin'ity tany ity; fa tsy handao anao Aho mandra-panaoko izay voalazako taminao.","Voici, je suis avec toi, je te garderai partout où tu iras, et je te ramènerai dans ce pays ; car je ne t’abandonnerai point, que je n’aie exécuté ce que je te dis."],[1,14,14,"Jehovah hiady ho anareo, fa ianareo kosa hangina.","L’Éternel combattra pour vous ; et vous, gardez le silence."],[1,20,8,"Mahatsiarova ny andro Sabata hanamasi-na azy.","Souviens-toi du jour du repos, pour le sanctifier."],[4,31,6,"Mahereza sy matanjaha; aza matahotra na manahy azy; fa Jehovah Andriamanitrao no miara-mandeha aminao; tsy handao anao na hahafoy anao Izy.","Fortifiez-vous et ayez du courage ! Ne craignez point et ne soyez point effrayés devant eux ; car l’Éternel, ton Dieu, marchera lui-même avec toi, il ne te délaissera point, il ne t’abandonnera point."],[4,31,8,"Ary Jehovah no mandeha eo alohanao; ary Izy no hiaraka aminao; tsy handao anao na hahafoy anao Izy; koa aza matahotra na mivadi-po ianao.","L’Éternel marchera lui-même devant toi, il sera lui-même avec toi, il ne te délaissera point, il ne t’abandonnera point ; ne crains point, et ne t’effraie point."],[5,1,9,"Tsy efa nandidy anao va Aho? Koa mahereza sy matanjaha; aza matahotra na mivadi-po, fa momba anao Jehovah Andriamanitrao amin'izay rehetra alehanao.","Ne t’ai-je pas donné cet ordre : Fortifie-toi et prends courage ? Ne t’effraie point et ne t’épouvante point, car l’Éternel, ton Dieu, est avec toi dans tout ce que tu entreprendras."],[8,16,7,"Fa hoy Jehovah tamin'i Samoela: Aza mijery ny tarehiny na ny hahavon'ny tsanganany, fa efa nolaviko izy; fa tsy mba toy ny fijerin'ny olona no fijerin'i Jehovah; fa ny olona mijery ny miseho eo ivelany, fa Jehovah kosa mijery ny fo.","Et l’Éternel dit à Samuel : Ne prends point garde à son apparence et à la hauteur de sa taille, car je l’ai rejeté. L’Éternel ne considère pas ce que l’homme considère ; l’homme regarde à ce qui frappe les yeux, mais l’Éternel regarde au cœur."],[13,7,14,"raha ny oloko izay nantsoina amin'ny anarako ho avy hanetry tena ka hivavaka sy hitady ny tavako ary hiala amin'ny ratsy fanaony, dia hihaino any an-danitra Aho ka hamela ny helony ary hahasitrana ny taniny.","si mon peuple sur qui est invoqué mon nom s’humilie, prie, et cherche ma face, et s’il se détourne de ses mauvaises voies, je l’exaucerai des cieux, je lui pardonnerai son péché, et je guérirai son pays."],[15,8,10,"Dia hoy izy taminy: Mandehana, hano ny matavy, ary sotroy ny mamy, dia mba anatero anjara izay tsy manan-javatra voavoatra; fa masina ho an'ny Tompontsika ity andro ity; koa aza malahelo ianareo, fa ny fifaliana avy amin'i Jehovah no fiarovana mafy ho anareo.","Ils leur dirent : Allez, mangez des viandes grasses et buvez des liqueurs douces, et envoyez des portions à ceux qui n’ont rien de préparé, car ce jour est consacré à notre Seigneur ; ne vous affligez pas, car la joie de l’Éternel sera votre force."],[17,19,25,"Kanefa raha izaho, dia fantatro fa velona ny Mpanavotra ahy, ka hitsangana any am-parany eo ambonin'ny vovoka Izy.","Mais je sais que mon rédempteur est vivant, Et qu’il se lèvera le dernier sur la terre."],[18,1,1,"Sambatra ny olona izay tsy mandeha eo amin'ny fisainan'ny ratsy fanahy, ary tsy mijanona eo amin'ny lalana falehan'ny mpanota, ary tsy mipetraka eo amin'ny fipetrahan'ny mpaniratsira;","Heureux l’homme qui ne marche pas selon le conseil des méchants, Qui ne s’arrête pas sur la voie des pécheurs, Et qui ne s’assied pas en compagnie des moqueurs,"],[18,16,11,"Hampahafantatra ahy ny lalan'aina Hianao; fa havokisam-pifaliana no eo anatrehanao, ary fahafinaretana no eo an-tananao an-kavanana mandrakizay.","Tu me feras connaître le sentier de la vie ; Il y a d’abondantes joies devant ta face, Des délices éternelles à ta droite."],[18,23,1,"Salamo nataon'i Davida. Jehovah no Mpiandry ahy, tsy hanan-java-mahory aho,","Cantique de David. L’Éternel est mon berger : je ne manquerai de rien."],[18,23,4,"Eny, na dia mandeha mamaky ny lohasaha aloky ny fahafatesana aza aho, dia tsy hatahotra ny loza aho, fa Hianao no amiko; ny tsorakazonao sy ny tehinao, ireo no mahafa-tahotra ahy.","Quand je marche dans la vallée de l’ombre de la mort, Je ne crains aucun mal, car tu es avec moi : Ta houlette et ton bâton me rassurent."],[18,27,1,"Nataon'i Davida Jehovah no fahazavako sy famonjena ahy; iza no hatahorako? Jehovah no fiarovana mafy ho an'ny aiko; iza no hangovitako?","De David. L’Éternel est ma lumière et mon salut : De qui aurais-je crainte ? L’Éternel est le soutien de ma vie : De qui aurais-je peur ?"],[18,32,8,"Hanome saina anao sy hampianatra anao izay lalan-kalehanao Aho; hitsinjo anao ny masoko ka hanolotsaina anao Aho.","Je t’instruirai et te montrerai la voie que tu dois suivre ; Je te conseillerai, j’aurai le regard sur toi."],[18,37,4,"Ary miravoravoa amin'i Jehovah ianao, dia homeny anao izay irin'ny fonao.","Fais de l’Éternel tes délices, Et il te donnera ce que ton cœur désire."],[18,37,5,"Ankino amin'i Jehovah ny lalanao, ary matokia Azy, fa hataony tanteraka.","Recommande ton sort à l’Éternel, Mets en lui ta confiance, et il agira."],[18,91,1,"Ny mitoetra ao amin'ny fierena izay an'ny Avo Indrindra Dia monina eo ambanin'ny aloky ny Tsitoha.","Celui qui demeure sous l’abri du Très-Haut Repose à l’ombre du Tout-Puissant."],[18,91,11,"Fa Izy handidy ny anjeliny ny aminao Mba hiaro anao eny amin'izay rehetra halehanao.","Car il ordonnera à ses anges De te garder dans toutes tes voies ;"],[18,103,2,"Misaora an'i Jehovah, ry fanahiko; Ary aza misy hadinoinao ny fitahiany rehetra,","Mon âme, bénis l’Éternel, Et n’oublie aucun de ses bienfaits !"],[18,118,24,"Ity no andro nataon'i Jehovah; Hifaly sy ho ravoravo amin'izao isika.","C’est ici la journée que l’Éternel a faite : Qu’elle soit pour nous un sujet d’allégresse et de joie !"],[18,119,11,"Ato am-poko no iraketako ny teninao, Mba tsy hanotako aminao.","Je serre ta parole dans mon cœur, Afin de ne pas pécher contre toi."],[18,119,105,"Fanilon'ny tongotro Sy fanazavana ny lalako ny teninao.","Ta parole est une lampe à mes pieds, Et une lumière sur mon sentier."],[18,121,1,"Fihirana fiakarana. Manopy ny masoko ho amin'ny tendrombohitra aho; Avy aiza ny famonjena ahy?","Cantique des degrés. Je lève mes yeux vers les montagnes… D’où me viendra le secours ?"],[18,121,2,"Ny famonjena ahy dia avy amin'i Jehovah, Mpanao ny lanitra sy ny tany.","Le secours me vient de l’Éternel, Qui a fait les cieux et la terre."],[18,127,1,"Fihirana fiakarana. Nataon'i Solomona. Raha tsy Jehovah no manao ny trano, Dia miasa foana ny mpanao azy. Raha tsy Jehovah no miambina ny tanàna, Dia miari-tory foana ny mpiambina.","Cantique des degrés. De Salomon. Si l’Éternel ne bâtit la maison, Ceux qui la bâtissent travaillent en vain ; Si l’Éternel ne garde la ville, Celui qui la garde veille en vain."],[18,133,1,"Fihirana fiakarana. Nataon'i Davida. Endrey, tsara sady mahafinaritra Raha ny mpirahalahy no miara-monina","Cantique des degrés. De David. Voici, oh ! Qu’il est agréable, qu’il est doux Pour des frères de demeurer ensemble !"],[18,139,14,"Hidera Anao aho; fa mahatahotra sy mahatalanjona ny nanaovana ahy; Mahagaga ny asanao; Ary fantatry ny fanahiko marimarina izany.","Je te loue de ce que je suis une créature si merveilleuse. Tes œuvres sont admirables, Et mon âme le reconnaît bien."],[18,145,18,"Jehovah dia eo akaikin'izay rehetra miantso Azy, Dia izay rehetra miantso Azy marina tokoa.","L’Éternel est près de tous ceux qui l’invoquent, De tous ceux qui l’invoquent avec sincérité ;"],[18,147,3,"Mahasitrana ny torotoro fo Izy Sy mamehy ny feriny.","Il guérit ceux qui ont le cœur brisé, Et il panse leurs blessures."],[18,150,6,"Aoka izay rehetra manam-pofonaina samy hidera an'i Jehovah. Haleloia.","Que tout ce qui respire loue l’Éternel ! Louez l’Éternel !"],[19,3,5,"Matokia an'i Jehovah amin'ny fonao rehetra, Fa aza miankina amin'ny fahalalanao;","Confie-toi en l’Éternel de tout ton cœur, Et ne t’appuie pas sur ta sagesse ;"],[19,3,6,"Maneke Azy amin'ny alehanao rehetra, Fa Izy handamina ny lalanao,","Reconnais-le dans toutes tes voies, Et il aplanira tes sentiers."],[19,4,23,"Tandremo ny fonao mihoatra noho izay rehetra tokony hotandremana; Fa avy ao aminy no ihavian'ny aina.","Garde ton cœur plus que toute autre chose, Car de lui viennent les sources de la vie."],[19,16,3,"Ankino amin'i Jehovah ny asanao, Dia ho lavorary izay kasainao.","Recommande à l’Éternel tes œuvres, Et tes projets réussiront."],[19,18,10,"Ny anaran'i Jehovah dia tilikambo mafy; Ny marina miezaka ho ao aminy ka voavonjy.","Le nom de l’Éternel est une tour forte ; Le juste s’y réfugie, et se trouve en sûreté."],[19,22,6,"Zaro amin'izay lalana tokony halehany ny zaza, Ka na rehefa antitra aza izy, dia tsy hiala amin'izany.","Instruis l’enfant selon la voie qu’il doit suivre ; Et quand il sera vieux, il ne s’en détournera pas."],[20,3,1,"Ny zavatra rehetra samy manana ny fotoany avy, ary samy manana ny androny avy ny raharaha rehetra atỳ ambanin'ny lanitra:","Il y a un temps pour tout, un temps pour toute chose sous les cieux :"],[22,26,3,"Ny saina tsy miovaova dia harovanao ao amin'ny fiadanana tanteraka, satria matoky Anao izy.","A celui qui est ferme dans ses sentiments Tu assures la paix, la paix, Parce qu’il se confie en toi."],[22,40,8,"Maina ny ahitra, malazo ny voniny; Fa ny tenin'Andriamanitsika dia haharitra mandrakizay.","L’herbe sèche, la fleur tombe ; Mais la parole de notre Dieu subsiste éternellement."],[22,40,29,"Mampahatanjaka ny reraka Izy, ary izay kely hery dia omeny hery be.","Il donne de la force à celui qui est fatigué, Et il augmente la vigueur de celui qui tombe en défaillance."],[22,40,31,"Fa izay miandry an'i Jehovah dia mandroso hery kosa; Elatra no hiakarany tahaka ny voromahery; Hihazakazaka izy, nefa tsy ho sasatra; Handeha izy, nefa tsy ho reraka.","Mais ceux qui se confient en l’Éternel renouvellent leur force. Ils prennent le vol comme les aigles ; Ils courent, et ne se lassent point, Ils marchent, et ne se fatiguent point."],[22,41,10,"Aza matahotra ianao, fa momba anao Aho; Ary aza miherikerika foana, fa Izaho no Andriamanitrao; Mampahery anao Aho sady mamonjy anao; Eny, mitantana anao amin'ny tanana ankavanan'ny fahamarinako Aho.","Ne crains rien, car je suis avec toi ; Ne promène pas des regards inquiets, car je suis ton Dieu ; Je te fortifie, je viens à ton secours, Je te soutiens de ma droite triomphante."],[22,43,2,"Raha mita ny rano ianao, dia homba anao Aho; Ary raha mita ny ony ianao, dia tsy hanafotra anao izy; Raha mandeha mamaky ny afo ianao, dia tsy ho may, Ary tsy hirehitra aminao ny lelafo;","Si tu traverses les eaux, je serai avec toi ; Et les fleuves, ils ne te submergeront point ; Si tu marches dans le feu, tu ne te brûleras pas, Et la flamme ne t’embrasera pas."],[22,53,5,"Nefa Izy dia voalefona noho ny fahadisoantsika sy notorotoroina noho ny helotsika, ny fampijaliana nahazoantsika fihavanana no namelezana Azy; ary ny dian-kapoka taminy no nahasitranana antsika.","Mais il était blessé pour nos péchés, Brisé pour nos iniquités ; Le châtiment qui nous donne la paix est tombé sur lui, Et c’est par ses meurtrissures que nous sommes guéris."],[22,55,6,"Mitadiava an'i Jehovah, dieny mbola hita Izy, Miantsoa Azy, dieny mbola akaiky Izy.","Cherchez l’Éternel pendant qu’il se trouve ; Invoquez-le, tandis qu’il est près."],[22,55,8,"Fa ny fihevitro tsy fihevitrareo ary ny lalanareo kosa tsy mba lalako, hoy Jehovah.","Car mes pensées ne sont pas vos pensées, Et vos voies ne sont pas mes voies, Dit l’Éternel."],[22,58,13,"Raha miaro ny tongotrao amin'ny Sabata ianao ka tsy manao izay tianao amin'ny androko masina, ary manao ny Sabata hoe Fahafinaretana, ary ny nohamasinin'i Jehovah hoe mendrika hohajaina, ka manome voninahitra azy ary tsy mandeha amin'ny lalanao, na manao izay tianao, na miteniteny foana,","Si tu retiens ton pied pendant le sabbat, Pour ne pas faire ta volonté en mon saint jour, Si tu fais du sabbat tes délices, Pour sanctifier l’Éternel en le glorifiant, Et si tu l’honores en ne suivant point tes voies, En ne te livrant pas à tes penchants et à de vains discours,"],[22,60,1,"Mitsangàna, mihazavà, fa tonga ny fahazavanao, ary ny voninahitr'i Jehovah efa miposaka aminao.","Lève-toi, sois éclairée, car ta lumière arrive, Et la gloire de l’Éternel se lève sur toi."],[23,29,11,"Fa Izaho mahalala ny hevitra iheverako anareo, hoy Jehovah, dia hevitra hahatonga fiadanana, fa tsy loza, mba hanome anareo fanantenana ny amin'ny farany.","Car je connais les projets que j’ai formés sur vous, dit l’Éternel, projets de paix et non de malheur, afin de vous donner un avenir et de l’espérance."],[23,33,3,"Antsoy Aho, dia hovaliako ianao ka hampisehoako zavatra lehibe sy saro-pantarina izay tsy fantatrao.","Invoque-moi, et je te répondrai ; Je t’annoncerai de grandes choses, des choses cachées, Que tu ne connais pas."],[24,3,22,"Ny famindram-pon'i Jehovah no tsy nahalany ritra antsika, fa tsy mitsahatra ny fiantrany.","Les bontés de l’Éternel ne sont pas épuisées, Ses compassions ne sont pas à leur terme ;"],[24,3,23,"Vaovao isa-maraina izany; lehibe ny fahamarinanao.","Elles se renouvellent chaque matin. Oh ! Que ta fidélité est grande !"],[25,36,26,"Ary homeko fo vaovao ianareo, ary fanahy vaovao no hataoko ao anatinareo, ary hesoriko amin'ny nofonareo ny fo vato, ka homeko fo nofo ianareo.","Je vous donnerai un cœur nouveau, et je mettrai en vous un esprit nouveau ; j’ôterai de votre corps le cœur de pierre, et je vous donnerai un cœur de chair."],[26,2,44,"Ary amin'ny andron'ireo mpanjaka ireo Andriamanitry ny lanitra dia hanorina fanjakana izay tsy ho rava mandrakizay; ary izany fanjakana izany tsy havela ho an'olon- kafa, fa ireo fanjakana rehetra ireo dia hotorotoroiny sy holevoniny, fa izy kosa hitoetra mandrakizay.","Dans le temps de ces rois, le Dieu des cieux suscitera un royaume qui ne sera jamais détruit, et qui ne passera point sous la domination d’un autre peuple ; il brisera et anéantira tous ces royaumes-là, et lui-même subsistera éternellement."],[26,8,14,"Ary hoy izy tamiko: Telon-jato sy roa arivo andro; ary nony afaka izany, dia amin'izay vao hodiovina ny fitoerana masina.","Et il me dit : Deux mille trois cents soirs et matins ; puis le sanctuaire sera purifié."],[26,12,3,"Ary izay hendry dia hamirapiratra toy ny famirapiratry ny lanitra; ary izay mamerina ny maro ho amin'ny fahamarinana dia ho tahaka ny kitana mandrakizay doria.","Ceux qui auront été intelligents brilleront comme la splendeur du ciel, et ceux qui auront enseigné la justice, à la multitude brilleront comme les étoiles, à toujours et à perpétuité."],[32,6,8,"Ry olombelona, efa naseho anao izay tsara Sy izay ilain'i Jehovah aminao, Dia izao ihany: Ny hanao ny marina sy ny ho tia famindram-po Ary ny hanaraka an'Andriamanitrao amin'ny fanetren-tena","On t’a fait connaître, ô homme, ce qui est bien ; Et ce que l’Éternel demande de toi, C’est que tu pratiques la justice, Que tu aimes la miséricorde, Et que tu marches humblement avec ton Dieu."],[34,2,3,"Fa ny fahitana dia mbola ho amin'ny fotoan'andro, Ary mikendry ny farany izy ka tsy ho diso; Eny, na dia mitaredretra aza izy, andraso ihany, Fa ho avy tokoa izy ka tsy hijanona.","Car c’est une prophétie dont le temps est déjà fixé, Elle marche vers son terme, et elle ne mentira pas ; Si elle tarde, attends-la, Car elle s’accomplira, elle s’accomplira certainement."],[35,3,17,"Jehovah Andriamanitrao no ao aminao, Mahery Izy ka hamonjy; Hiravoravo anao amin'ny fifaliana Izy; Ho sondriana amin'ny fitiavany Izy; Hifaly anao amin'ny fihobiana Izy.","L’Éternel, ton Dieu, est au milieu de toi, comme un héros qui sauve ; Il fera de toi sa plus grande joie ; Il gardera le silence dans son amour ; Il aura pour toi des transports d’allégresse."],[39,5,3,"Sambatra ny malahelo am-panahy; fa azy ny fanjakan'ny lanitra.","Heureux les pauvres en esprit, car le royaume des cieux est à eux !"],[39,5,8,"Sambatra ny madio am-po; fa izy no hahita an'Andriamanitra,","Heureux ceux qui ont le cœur pur, car ils verront Dieu !"],[39,5,9,"Sambatra ny mpampihavana; fa izy no hatao hoe zanak'Andriamanitra.","Heureux ceux qui procurent la paix, car ils seront appelés fils de Dieu !"],[39,5,14,"Hianareo no fahazavan'izao tontolo izao. Tsy azo afenina izay tanàna miorina eo an-tampontendrombohitra.","Vous êtes la lumière du monde. Une ville située sur une montagne ne peut être cachée ;"],[39,5,16,"Aoka hazava eo imason'ny olona toy izany koa ny fahazavanareo, mba hahitany ny asa soa ataonareo ka hankalazany ny Rainareo Izay any an-danitra.","Que votre lumière luise ainsi devant les hommes, afin qu’ils voient vos bonnes œuvres, et qu’ils glorifient votre Père qui est dans les cieux."],[39,6,33,"Fa katsaho aloha ny fanjakany sy ny fahamarinany, dia hanampy ho anareo izany rehetra izany.","Cherchez premièrement le royaume et la justice de Dieu ; et toutes ces choses vous seront données par-dessus."],[39,6,34,"Ary amin'izany dia aza manahy ny amin'ny ampitso ianareo; fa ny ampitso hanahy ny azy. Ampy ho an'ny andro ny ratsy miseho ao aminy.","Ne vous inquiétez donc pas du lendemain ; car le lendemain aura soin de lui-même. A chaque jour suffit sa peine."],[39,7,7,"Mangataha, dia homena ianareo; mitadiava, dia hahita ianareo; dondony, dia hovohana ianareo.","Demandez, et l’on vous donnera ; cherchez, et vous trouverez ; frappez, et l’on vous ouvrira."],[39,7,12,"Koa amin'izany na inona na inona tianareo hataon'ny olona aminareo, dia mba ataovy aminy kosa tahaka izany; fa izany no lalàna sy mpaminany.","Tout ce que vous voulez que les hommes fassent pour vous, faites-le de même pour eux, car c’est la loi et les prophètes."],[39,11,28,"Mankanesa atỳ amiko, ianareo rehetra izay miasa fatratra sy mavesatra entana, fa Izaho no hanome anareo fitsaharana.","Venez à moi, vous tous qui êtes fatigués et chargés, et je vous donnerai du repos."],[39,11,29,"Ento ny ziogako, ka mianara amiko; fa malemy fanahy sady tsy miavona am-po Aho; dia hahita fitsaharana ho an'ny fanahinareo ianareo.","Prenez mon joug sur vous et recevez mes instructions, car je suis doux et humble de cœur ; et vous trouverez du repos pour vos âmes."],[39,16,26,"Fa inona moa no soa ho azon'ny olona, raha mahazo izao tontolo izao, kanefa very ny ainy? Ary inona no homen'ny olona ho takalon'ny ainy?","Et que servirait-il à un homme de gagner tout le monde, s’il perdait son âme ? Ou, que donnerait un homme en échange de son âme ?"],[39,18,20,"Fa na aiza na aiza no iangonan'ny roa na telo amin'ny anarako, dia ao afovoany Aho.","Car là où deux ou trois sont assemblés en mon nom, je suis au milieu d’eux."],[39,22,37,"Dia hoy Jesosy taminy: Tiava an'i Jehovah Andriamanitrao amin'ny fonao rehetra sy ny fanahinao rehetra ary ny sainao rehetra (Deo. 6. 5).","Jésus lui répondit : Tu aimeras le Seigneur, ton Dieu, de tout ton cœur, de toute ton âme, et de toute ta pensée."],[39,24,13,"Fa izay maharitra hatramin'ny farany no hovonjena.","Mais celui qui persévérera jusqu’à la fin sera sauvé."],[39,24,44,"Koa miomana kosa ianareo; fa amin'izay ora tsy ampoizinareo no hihavian'ny Zanak'olona.","C’est pourquoi, vous aussi, tenez-vous prêts, car le Fils de l’homme viendra à l’heure où vous n’y penserez pas."],[39,28,19,"koa mandehana ianareo, dia ataovy mpianatra ny firenena rehetra, manao batisa azy ho amin'ny anaran'ny Ray sy ny Zanaka ary ny Fanahy Masina","Allez, faites de toutes les nations des disciples, les baptisant au nom du Père, du Fils et du Saint-Esprit,"],[39,28,20,"sady mampianatra azy hitandrina izay rehetra nandidiako anareo; ary, indro, Izaho momba anareo mandrakariva ambara-pahatongan'ny fahataperan'izao tontolo izao.","et enseignez-leur à observer tout ce que je vous ai prescrit. Et voici, je suis avec vous tous les jours, jusqu’à la fin du monde."],[40,10,27,"Fa Jesosy nijery azy ka nanao hoe: Raha amin'ny olona, dia zavatra tsy hainy izany; fa tsy mba tahaka izany amin'Andriamanitra; fa ny zavatra rehetra dia hain'Andriamanitra.","Jésus les regarda, et dit : Cela est impossible aux hommes, mais non à Dieu : car tout est possible à Dieu."],[40,16,15,"","Puis il leur dit : Allez par tout le monde, et prêchez la bonne nouvelle à toute la création."],[41,1,37,"Fa tsy hisy tsy ho tanteraka ny teny rehetra ataon'Andriamanitra.","Car rien n’est impossible à Dieu."],[41,2,11,"fa Mpamonjy no teraka ho anareo anie ao an-tanànan'i Davida, dia Kristy Tompo.","c’est qu’aujourd’hui, dans la ville de David, il vous est né un Sauveur, qui est le Christ, le Seigneur."],[41,6,31,"Ary araka izay tianareo hataon'ny olona aminareo, dia mba ataovy aminy kosa.","Ce que vous voulez que les hommes fassent pour vous, faites-le de même pour eux."],[41,19,10,"Fa efa tonga ny Zanak'olona hitady sy hamonjy ny very.","Car le Fils de l’homme est venu chercher et sauver ce qui était perdu."],[42,1,1,"Tamin'ny voalohany ny Teny, ary ny Teny tao amin'Andriamanitra, ary ny Teny dia Andriamanitra.","Au commencement était la Parole, et la Parole était avec Dieu, et la Parole était Dieu."],[42,1,12,"Fa izay rehetra nandray Azy dia nomeny hery ho tonga zanak'Andriamanitra, dia izay mino ny anarany,","Mais à tous ceux qui l’ont reçue, à ceux qui croient en son nom, elle a donné le pouvoir de devenir enfants de Dieu, lesquels sont nés,"],[42,3,16,"Fa toy izao no nitiavan' Andriamanitra izao tontolo izao: nomeny ny Zanani-lahy Tokana, mba tsy ho very izay rehetra mino Azy, fa hanana fiainana mandrakizay.","Car Dieu a tant aimé le monde qu’il a donné son Fils unique, afin que quiconque croit en lui ne périsse point, mais qu’il ait la vie éternelle."],[42,8,32,"ka ho fantatrareo ny marina, ary ny marina hahafaka anareo tsy ho andevo.","vous connaîtrez la vérité, et la vérité vous affranchira."],[42,10,10,"Ny mpangalatra tsy avy raha tsy hangalatra sy hamono ary handringana; Izaho avy mba hananany fiainana, sady hananany be dia be.","Le voleur ne vient que pour dérober, égorger et détruire ; moi, je suis venu afin que les brebis aient la vie, et qu’elles soient dans l’abondance."],[42,11,25,"Hoy Jesosy taminy: Izaho no fananganana ny maty sy fiainana; izay mino Ahy, na dia maty aza, dia ho velona indray.","Jésus lui dit : Je suis la résurrection et la vie. Celui qui croit en moi vivra, quand même il serait mort ;"],[42,13,34,"Didy vaovao no omeko anareo, dia ny mba hifankatiavanareo; eny, aoka ho tahaka ny fitiavako anareo no mba hifankatiavanareo kosa.","Je vous donne un commandement nouveau : Aimez-vous les uns les autres ; comme je vous ai aimés, vous aussi, aimez-vous les uns les autres."],[42,14,1,"Aza malahelo ny fonareo; minoa an'Andriamanitra, ary minoa Ahy koa.","Que votre cœur ne se trouble point. Croyez en Dieu, et croyez en moi."],[42,14,2,"Ao an-tranon'ny Raiko misy fitoerana maro; raha tsy izany, dia efa nilaza taminareo Aho; fa handeha hamboatra fitoerana ho anareo Aho.","Il y a plusieurs demeures dans la maison de mon Père. Si cela n’était pas, je vous l’aurais dit. Je vais vous préparer une place."],[42,14,3,"Ary raha handeha hamboatra fitoerana ho anareo Aho, dia ho avy indray ka handray anareo ho any amiko, ka izay itoerako no hitoeranareo koa.","Et, lorsque je m’en serai allé, et que je vous aurai préparé une place, je reviendrai, et je vous prendrai avec moi, afin que là où je suis vous y soyez aussi."],[42,14,6,"Hoy Jesosy taminy: Izaho no lalana sy fahamarinana ary fiainana; tsy misy olona mankany amin'ny Ray, afa-tsy amin'ny alalako.","Jésus lui dit : Je suis le chemin, la vérité, et la vie. Nul ne vient au Père que par moi."],[42,14,27,"Fiadanana no avelako ho anareo, ny fiadanako no omeko anareo; tsy tahaka ny fanomen'izao tontolo izao no fanomeko anareo. Aza malahelo na matahotra ny fonareo.","Je vous laisse la paix, je vous donne ma paix. Je ne vous donne pas comme le monde donne. Que votre cœur ne se trouble point, et ne s’alarme point."],[42,15,5,"Izaho no voaloboka, ianareo no sampany. Izay miray amiko, ary Izaho aminy, dia mamoa be izy; fa raha misaraka amiko kosa ianareo, dia tsy mahay manao na inona na inona.","Je suis le cep, vous êtes les sarments. Celui qui demeure en moi et en qui je demeure porte beaucoup de fruit, car sans moi vous ne pouvez rien faire."],[42,15,13,"Tsy misy manana fitiavana lehibe noho izao, dia ny manolotra ny ainy hamonjy ny sakaizany.","Il n’y a pas de plus grand amour que de donner sa vie pour ses amis."],[42,16,33,"Izany teny izany efa nolazaiko taminareo mba hanananareo fiadanana amiko. Atỳ amin'izao tontolo izao no ahitanareo fahoriana; nefa matokia; Izaho efa naharesy izao tontolo izao.","Je vous ai dit ces choses, afin que vous ayez la paix en moi. Vous aurez des tribulations dans le monde ; mais prenez courage, j’ai vaincu le monde."],[43,1,8,"Fa hahazo hery ianareo amin'ny hilatsahan'ny Fanahy Masina aminareo, ary ho vavolombeloko any Jerosalema sy eran'i Jodia sy Samaria ary hatramin'ny faran'ny tany.","Mais vous recevrez une puissance, le Saint-Esprit survenant sur vous, et vous serez mes témoins à Jérusalem, dans toute la Judée, dans la Samarie, et jusqu’aux extrémités de la terre."],[43,1,11,"izay nanao hoe: Ry lehilahy Galiliana, nahoana no mijanona eto mijery ny lanitra ianareo? iny Jesosy Izay nampiakarina niala taminareo ho any an-danitra iny dia mbola ho avy tahaka ny nahitanareo Azy niakatra ho any an-danitra.","et dirent : Hommes Galiléens, pourquoi vous arrêtez-vous à regarder au ciel ? Ce Jésus, qui a été enlevé au ciel du milieu de vous, reviendra de la même manière que vous l’avez vu allant au ciel."],[43,4,12,"Ary tsy misy famonjena amin'ny hafa; fa tsy misy anarana hafa ambanin'ny lanitra nomena ny olona izay hahazoantsika famonjena.","Il n’y a de salut en aucun autre ; car il n’y a sous le ciel aucun autre nom qui ait été donné parmi les hommes, par lequel nous devions être sauvés."],[43,16,31,"Dia hoy izy roa lahy: Minoa an'i Jesosy Tompo, dia hovonjena ianao sy ny ankohonanao.","Paul et Silas répondirent : Crois au Seigneur Jésus, et tu seras sauvé, toi et ta famille."],[44,3,23,"fa samy efa nanota izy rehetra ka tsy manana ny voninahitra avy amin'Andriamanitra,","Car tous ont péché et sont privés de la gloire de Dieu ;"],[44,5,8,"Fa Andriamanitra mampiseho ny fitiavany antsika, fa fony mbola mpanota isika, dia maty hamonjy antsika Kristy.","Mais Dieu prouve son amour envers nous, en ce que, lorsque nous étions encore des pécheurs, Christ est mort pour nous."],[44,6,23,"Fa fahafatesana no tambin'ny ota; ary fiainana mandrakizay no fanomezam-pahasoavana avy amin'Andriamanitra ao amin'i Kristy Jesosy Tompontsika.","Car le salaire du péché, c’est la mort ; mais le don gratuit de Dieu, c’est la vie éternelle en Jésus-Christ notre Seigneur."],[44,8,1,"Ary amin'izany dia tsy misy fanamelohana ho an'izay ao amin'i Kristy Jesosy.","Il n’y a donc maintenant aucune condamnation pour ceux qui sont en Jésus-Christ."],[44,8,28,"Ary fantatsika fa ny zavatra rehetra dia miara-miasa hahasoa izay tia an'Andriamanitra, dia izay voantso araka ny fikasany rahateo.","Nous savons, du reste, que toutes choses concourent au bien de ceux qui aiment Dieu, de ceux qui sont appelés selon son dessein."],[44,8,31,"Inona ary no holazaintsika ny amin'izany zavatra izany? Raha Andriamanitra momba antsika, iza no hahatohitra antsika?","Que dirons-nous donc à l’égard de ces choses ? Si Dieu est pour nous, qui sera contre nous ?"],[44,8,38,"Fa matoky aho fa na fahafatesana, na fiainana, na anjely, na ireo fanapahana, na zavatra ankehitriny, na zavatra ho avy, na hery,","Car j’ai l’assurance que ni la mort ni la vie, ni les anges ni les dominations, ni les choses présentes ni les choses à venir,"],[44,10,9,"satria raha manaiky an'i Jesosy ho Tompo amin'ny vavanao ianao ary mino amin'ny fonao fa Andriamanitra efa nanangana Azy tamin'ny maty, dia hovonjena ianao.","Si tu confesses de ta bouche le Seigneur Jésus, et si tu crois dans ton cœur que Dieu l’a ressuscité des morts, tu seras sauvé."],[44,10,17,"Koa ny finoana dia avy amin'ny tori-teny, ary ny tori-teny kosa avy amin'ny tenin'i Kristy.","Ainsi la foi vient de ce qu’on entend, et ce qu’on entend vient de la parole de Christ."],[44,12,1,"Koa amin'izany mangataka aminareo aho, ry rahalahy, noho ny famindram-pon'Andriamanitra, mba hatolotrareo ny tenanareo ho fanatitra velona, masina, sitrak'Andriamanitra, dia fanompoam-panahy mety hataonareo izany.","Je vous exhorte donc, frères, par les compassions de Dieu, à offrir vos corps comme un sacrifice vivant, saint, agréable à Dieu, ce qui sera de votre part un culte raisonnable."],[44,12,2,"Ary aza manaraka ny fanaon'izao tontolo izao; fa miovà amin'ny fanavaozana ny saina, hamantaranareo ny sitrapon'Andriamanitra, dia izay tsara sady ankasitrahana no marina. .","Ne vous conformez pas au siècle présent, mais soyez transformés par le renouvellement de l’intelligence, afin que vous discerniez quelle est la volonté de Dieu, ce qui est bon, agréable et parfait."],[44,12,12,"Mifalia amin'ny fanantenana; miareta amin'ny fahoriana; mahareta amin'ny fivavahana.","Réjouissez-vous en espérance. Soyez patients dans l’affliction. Persévérez dans la prière."],[44,15,13,"Ary Andriamanitry ny fanantenana anie hameno anareo amin'ny fifaliana sy ny fiadanana rehetra amin'ny finoanareo, mba hitomboanareo amin'ny fanantenana noho ny herin'ny Fanahy Masina.","Que le Dieu de l’espérance vous remplisse de toute joie et de toute paix dans la foi, pour que vous abondiez en espérance, par la puissance du Saint-Esprit !"],[45,10,13,"Tsy misy fakam-panahy nahazo anareo afa-tsy izay zakan'ny olombelona; nefa mahatoky Andriamanitra ka tsy hamela anareo halaim-panahy mihoatra noho izay zakanareo; fa momba ny fakam-panahy dia hasiany lalana hahafahanareo koa mba hahazakanareo izany.","Aucune tentation ne vous est survenue qui n’ait été humaine, et Dieu, qui est fidèle, ne permettra pas que vous soyez tentés au-delà de vos forces ; mais avec la tentation il préparera aussi le moyen d’en sortir, afin que vous puissiez la supporter."],[45,13,4,"Ny fitiavana mahari-po sady mora fanahy; ny fitiavana tsy mialona, tsy mirehareha, tsy mieboebo,","La charité est patiente, elle est pleine de bonté ; la charité n’est point envieuse ; la charité ne se vante point, elle ne s’enfle point d’orgueil,"],[45,13,13,"Ary ankehitriny dia ireto telo ireto no mitoetra: ny finoana, ny fanantenana, ny fitiavana: fa ny fitiavana no lehibe amin'ireo.","Maintenant donc ces trois choses demeurent : la foi, l’espérance, la charité ; mais la plus grande de ces choses, c’est la charité."],[45,15,57,"Fa isaorana anie Andriamanitra, Izay manome antsika ny fandresena amin'ny alalan'i Jesosy Kristy Tompontsika.","Mais grâces soient rendues à Dieu, qui nous donne la victoire par notre Seigneur Jésus-Christ !"],[45,16,14,"Izay rehetra ataonareo dia ataovy amin'ny fitiavana.","Que tout ce que vous faites se fasse avec charité !"],[46,5,17,"Koa raha misy olona ao amin'i Kristy, dia olom-baovao izy; efa lasa ny zavatra taloha, indreo, efa tonga vaovao ireo.","Si quelqu’un est en Christ, il est une nouvelle créature. Les choses anciennes sont passées ; voici, toutes choses sont devenues nouvelles."],[46,12,9,"Nefa hoy Izy tamiko; Ampy ho anao ny fahasoavako; fa ny heriko. dia tanterahina amin'ny fahalemena. Koa mainka sitrako ny hirehareha amin'ny fahalemeko, mba hitoeran'ny herin'i Kristy amiko.","et il m’a dit : Ma grâce te suffit, car ma puissance s’accomplit dans la faiblesse. Je me glorifierai donc bien plus volontiers de mes faiblesses, afin que la puissance de Christ repose sur moi."],[47,2,20,"Voahombo miaraka amin'i Kristy amin'ny hazo fijaliana aho, ary tsy izaho intsony no velona, fa Kristy no velona ato anatiko; fa izay ivelomako ankehitriny eo amin'ny nofo dia ivelomako amin'ny finoana ny Zanak'Andriamanitra, Izay efa tia ahy ka nanolotra ny tenany hamonjy ahy.","J’ai été crucifié avec Christ ; et si je vis, ce n’est plus moi qui vis, c’est Christ qui vit en moi ; si je vis maintenant dans la chair, je vis dans la foi au Fils de Dieu, qui m’a aimé et qui s’est livré lui-même pour moi."],[47,5,22,"Fa ny vokatry ny Fanahy kosa dia fitiavana, fifaliana, fiadanana, fahari-po fahamoram-panahy, fanaovantsoa, fahamarinana,","Mais le fruit de l’Esprit, c’est l’amour, la joie, la paix, la patience, la bonté, la bénignité, la fidélité, la douceur, la tempérance ;"],[47,6,9,"Ary aza mba ketraka amin'ny fanaovan-tsoa isika; fa amin'ny fotoan'andro no hijinjantsika, raha tsy reraka isika.","Ne nous lassons pas de faire le bien ; car nous moissonnerons au temps convenable, si nous ne nous relâchons pas."],[48,2,8,"Fa fahasoavana no namonjena anareo amin'ny finoana; ary tsy avy aminareo izany, fa fanomezana avy amin'Andriamanitra;","Car c’est par la grâce que vous êtes sauvés, par le moyen de la foi. Et cela ne vient pas de vous, c’est le don de Dieu."],[48,2,10,"Fa asany isika, voaforona tao amin'i Kristy Jesosy mba hanao asa tsara, izay namboarin'Andriamanitra rahateo mba handehanantsika eo aminy.","Car nous sommes son ouvrage, ayant été créés en Jésus-Christ pour de bonnes œuvres, que Dieu a préparées d’avance, afin que nous les pratiquions."],[48,4,32,"ary aoka samy halemy fanahy amin'ny namany avy ianareo, ka hifampiantra sy hifamela heloka, tahaka ny namelan'Andriamanitra ny helokareo ao amin'i Kristy.","Soyez bons les uns envers les autres, compatissants, vous pardonnant réciproquement, comme Dieu vous a pardonné en Christ."],[48,6,10,"Farany, mahereza ao amin'ny Tompo sy amin'ny herin'ny faherezany.","Au reste, fortifiez-vous dans le Seigneur, et par sa force toute-puissante."],[49,1,6,"ary matoky indrindra aho fa Izay nanomboka asa tsara ao anatinareo no hahatanteraka izany mandrapihavin'ny andron'i Jesosy Kristy;","Je suis persuadé que celui qui a commencé en vous cette bonne œuvre la rendra parfaite pour le jour de Jésus-Christ."],[49,4,4,"Mifalia mandrakariva amin'ny Tompo; hoy izaho indray: Mifalia.","Réjouissez-vous toujours dans le Seigneur ; je le répète, réjouissez-vous."],[49,4,6,"Aza manahy na inona na inona; fa aoka ny fivavahana sy ny fifonana mbamin'ny fisaorana no ho entinareo manambara ny fangatahanareo amin'Andriamanitra amin'ny zavatra rehetra.","Ne vous inquiétez de rien ; mais en toute chose faites connaître vos besoins à Dieu par des prières et des supplications, avec des actions de grâces."],[49,4,7,"Ary ny fiadanan'Andriamanitra, izay mihoatra noho ny fahalalana rehetra, hiaro ny fonareo sy ny hevitrareo ao amin'i Kristy Jesosy.","Et la paix de Dieu, qui surpasse toute intelligence, gardera vos cœurs et vos pensées en Jésus-Christ."],[49,4,8,"Farany, ry rahalahy, na inona na inona marina, na inona na inona manan-kaja, na inona na inona mahitsy, na inona na inona madio, na inona na inona maha-te-ho-tia, na inona na inona tsara laza, raha misy hatsarampanahy, ary raha misy dera, dia hevero izany.","Au reste, frères, que tout ce qui est vrai, tout ce qui est honorable, tout ce qui est juste, tout ce qui est pur, tout ce qui est aimable, tout ce qui mérite l’approbation, ce qui est vertueux et digne de louange, soit l’objet de vos pensées."],[49,4,13,"Mahay ny zavatra rehetra aho ao amin'ilay mampahery ahy.","Je puis tout par celui qui me fortifie."],[49,4,19,"Fa Andriamanitro hahatanteraka izay rehetra tokony ho anareo araka ny hareny amin'ny voninahitra no amin'i Kristy Jesosy.","Et mon Dieu pourvoira à tous vos besoins selon sa richesse, avec gloire, en Jésus-Christ."],[50,3,2,"Saino ny zavatra any ambony, fa tsy ny zavatra etỳ an-tany.","Affectionnez-vous aux choses d’en haut, et non à celles qui sont sur la terre."],[50,3,23,"ary na inona na inona no ataonareo, dia ataovy amin'ny fo, tahaka ny ho an'ny Tompo, fa tsy ho an'olona,","Tout ce que vous faites, faites-le de bon cœur, comme pour le Seigneur et non pour des hommes,"],[51,4,16,"Fa ny tenan'ny Tompo no hidina avy any an-danitra amin'ny fiantsoana sy ny feon'ny arikanjely ary ny trompetran'Andriamanitra, ka izay maty ao amin i Kristy no hitsangana aloha;","Car le Seigneur lui-même, à un signal donné, à la voix d’un archange, et au son de la trompette de Dieu, descendra du ciel, et les morts en Christ ressusciteront premièrement."],[51,5,16,"Mifalia mandrakariva.","Soyez toujours joyeux."],[51,5,17,"Mivavaha, ka aza mitsahatra.","Priez sans cesse."],[51,5,18,"Misaora amin'ny zavatra rehetra; fa izany no sitrapon'Andriamanitra ao amin'i Kristy Jesosy ho anareo.","Rendez grâces en toutes choses, car c’est à votre égard la volonté de Dieu en Jésus-Christ."],[54,1,7,"Fa tsy nomen'Andriamanitra fanahy osa isika, fa fanahy mahery sy fitiavana ary fahononan-tena.","Car ce n’est pas un esprit de timidité que Dieu nous a donné, mais un esprit de force, d’amour et de sagesse."],[54,3,16,"Izay soratra rehetra nomen'ny tsindrimandrin'Andriamanitra dia mahasoa koa ho fampianarana, ho fandresen-dahatra, ho fanitsiana izay diso, ho fitaizana amin'ny fahamarinana,","Toute Écriture est inspirée de Dieu, et utile pour enseigner, pour convaincre, pour corriger, pour instruire dans la justice,"],[57,4,16,"Koa aoka isika hanatona ny seza fiandrianan'ny fahasoavana amin'ny fahasahiana, mba hahazoantsika famindram-po sy hahitantsika fahasoavana ho famonjena amin'izay andro mahory.","Approchons-nous donc avec assurance du trône de la grâce, afin d’obtenir miséricorde et de trouver grâce, pour être secourus dans nos besoins."],[57,11,1,"Ary ny finoana no fahatokiana ny amin'ny zavatra antenaina, fanehoana ny zavatra tsy hita.","Or la foi est une ferme assurance des choses qu’on espère, une démonstration de celles qu’on ne voit pas."],[57,11,6,"Fa raha tsy amin'ny finoana, dia tsy misy azo atao hahazoana sitraka aminy; fa izay manatona an'Andriamanitra dia tsy maintsy mino fa misy Izy sady Mpamaly soa izay mazoto mitady Azy.","Or sans la foi il est impossible de lui être agréable ; car il faut que celui qui s’approche de Dieu croie que Dieu existe, et qu’il est le rémunérateur de ceux qui le cherchent."],[57,12,1,"Koa amin'izany, satria misy vavolombelona maro be toy izany manodidina antsika toy ny rahona, dia aoka isika koa hanaisotra izay rehetra mitambesatra amintsika mbamin'ny ota izay malaky mahazo antsika, ary aoka isika hihazakazaka amin'ny faharetana amin'izao fihazakazahana filokana napetraka eo anoloantsika izao,","Nous donc aussi, puisque nous sommes environnés d’une si grande nuée de témoins, rejetons tout fardeau, et le péché qui nous enveloppe si facilement, et courons avec persévérance dans la carrière qui nous est ouverte,"],[57,13,5,"Aoka tsy ho amin'ny fitiavam-bola ny toe-tsainareo, fa mianina amin'izay anananareo; fa hoy Izy: \"Izaho tsy handao anao mihitsy na hahafoy anao akory\" (Jos. 1.5).","Ne vous livrez pas à l’amour de l’argent ; contentez-vous de ce que vous avez ; car Dieu lui-même a dit : Je ne te délaisserai point, et je ne t’abandonnerai point."],[57,13,8,"Jesosy Kristy no tsy miova omaly sy anio ary mandrakizay.","Jésus-Christ est le même hier, aujourd’hui, et éternellement."],[58,1,5,"Ary raha misy ianareo tsy manam-pahendrena, aoka izy hangataka amin'Andriamanitra, Izay manome malalaka ho an'ny olona rehetra sady tsy mandatsa; ary dia homena azy izany.","Si quelqu’un d’entre vous manque de sagesse, qu’il la demande à Dieu, qui donne à tous simplement et sans reproche, et elle lui sera donnée."],[58,1,22,"Fa aoka ho mpankatò ny teny ianareo, fa aza mpihaino fotsiny ihany ka mamitaka ny tenanareo.","Mettez en pratique la parole, et ne vous bornez pas à l’écouter, en vous trompant vous-mêmes par de faux raisonnements."],[58,4,7,"Ka dia maneke an Andriamanitra ianareo; ary manohera ny devoly, dia handositra anareo izy.","Soumettez-vous donc à Dieu ; résistez au diable, et il fuira loin de vous."],[58,4,8,"Manatòna an'Andriamanitra, dia hanatona anareo Izy. Diovy ny tananareo, ry mpanota; ary ataovy madio ny fonareo, ry mpiroa saina.","Approchez-vous de Dieu, et il s’approchera de vous. Nettoyez vos mains, pécheurs ; purifiez vos cœurs, hommes irrésolus."],[59,5,7,"ary apetraho aminy ny fanahianareo rehetra; fa Izy no miahy anareo (Sal. 55.22).","et déchargez-vous sur lui de tous vos soucis, car lui-même prend soin de vous."],[60,3,9,"Ny Tompo tsy mahela ny teny fikasany, araka izay ataon'ny sasany ho fahelany; fa mahari-po aminareo Izy, ka tsy tiany hisy ho very, fa mba ho tonga amin'ny fibebahana izy rehetra,","Le Seigneur ne tarde pas dans l’accomplissement de la promesse, comme quelques-uns le croient ; mais il use de patience envers vous, ne voulant pas qu’aucun périsse, mais voulant que tous arrivent à la repentance."],[61,1,9,"Raha miaiky ny fahotantsika isika, dia mahatoky sy marina Izy ka mamela ny fahotantsika sy manadio antsika ho afaka amin'ny tsi-fahamarinana rehetra.","Si nous confessons nos péchés, il est fidèle et juste pour nous les pardonner, et pour nous purifier de toute iniquité."],[61,3,1,"Endrey! manao ahoana ny fitiavana nasehon'ny Ray ho antsika, dia ny niantsoana antsika hoe zanak'Andriamanitra, sady izany tokoa isika! Koa noho izany dia tsy mahalala antsika izao tontolo izao, satria tsy nahalala Ary izy.","Voyez quel amour le Père nous a témoigné, pour que nous soyons appelés enfants de Dieu ! Et nous le sommes. Si le monde ne nous connaît pas, c’est qu’il ne l’a pas connu."],[61,4,8,"Izay tsy tia dia tsy mba mahalala an'Andriamanitra; fa Andriamanitra dia fitiavana.","Celui qui n’aime pas n’a pas connu Dieu, car Dieu est amour."],[61,4,19,"Isika tia, satria Izy efa dia antsika taloha.","Pour nous, nous l’aimons, parce qu’il nous a aimés le premier."],[61,5,14,"Ary izao no fahasahiana ananantsika eo anatrehany: Raha mangataka zavatra araka ny sitrapony isika, dia mihaino antsika Izy;","Nous avons auprès de lui cette assurance, que si nous demandons quelque chose selon sa volonté, il nous écoute."],[65,3,20,"Indro, efa mitsangana eo am-baravarana Aho ka mandondòna; raha misy mihaino ny feoko ka mamoha ny varavarana, dia hiditra ao aminy Aho ka hiara-misakafo aminy, ary izy amiko.","Voici, je me tiens à la porte, et je frappe. Si quelqu’un entend ma voix et ouvre la porte, j’entrerai chez lui, je souperai avec lui, et lui avec moi."],[65,14,7,"nanao tamin'ny feo mahery hoe: Matahora an'Andriamanitra, ka omeo voninahitra Izy; fa tonga ny andro fitsarany; ary miankohofa eo anoloan'izay nanao ny lanitra sy ny tany sy ny ranomasina ary ny loharano.","Il disait d’une voix forte : Craignez Dieu, et donnez-lui gloire, car l’heure de son jugement est venue ; et adorez celui qui a fait le ciel, et la terre, et la mer, et les sources d’eaux."],[65,14,12,"Indro ny faharetan'ny olona masina, dia izay mitandrina ny didin'Andriamanitra sy ny finoana an'i Jesosy.","C’est ici la persévérance des saints, qui gardent les commandements de Dieu et la foi de Jésus."],[65,21,4,"Ary hofafany ny ranomaso rehetra amin'ny masony; ary tsy hisy fahafatesana intsony, sady tsy hisy alahelo, na fitarainana, na fanaintainana; fa efa lasa ny zavatra taloha.","Il essuiera toute larme de leurs yeux, et la mort ne sera plus, et il n’y aura plus ni deuil, ni cri, ni douleur, car les premières choses ont disparu."],[65,22,12,"Indro avy faingana Aho; ary eto amiko ny famaliako, mba hamaliako ny olona rehetra araka ny asany.","Voici, je viens bientôt, et ma rétribution est avec moi, pour rendre à chacun selon ce qu’est son œuvre."],[65,22,20,"Hoy Izay manambara ireo zavatra ireo: Eny, avy faingana Aho. Amena. Avia, Jesosy Tompo!","Celui qui atteste ces choses dit : Oui, je viens bientôt. Amen ! Viens, Seigneur Jésus !"]];
