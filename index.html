const C28 = [{"c":0,"t":{"fr":"Les Saintes Écritures","mg":"Ny Soratra Masina"},"s":{"fr":"Les 66 livres de l'Ancien et du Nouveau Testament sont la Parole de Dieu écrite, donnée par inspiration divine à des hommes qui parlaient de la part de Dieu. La Bible révèle sa volonté et le chemin du salut. Elle est la règle de la foi et la mesure de tout enseignement et de toute expérience.","mg":"Ireo boky 66 ao amin'ny Testamenta Taloha sy Vaovao no Tenin'Andriamanitra voasoratra, natolotra tamin'ny alalan'ny tsindrimandrin'Andriamanitra ho an'ny olona niteny tamin'ny anarany. Ny Baiboly no manambara ny sitrapony sy ny lalan'ny famonjena. Izy no fitsipiky ny finoana sy fandrefesana ny fampianarana sy ny traikefa rehetra."},"r":{"fr":"La Bible est la Parole de Dieu et la règle de ma foi.","mg":"Ny Baiboly no Tenin'Andriamanitra sy fitsipiky ny finoako."},"k":[54,3,16,"Izay soratra rehetra nomen'ny tsindrimandrin'Andriamanitra dia mahasoa koa ho fampianarana, ho fandresen-dahatra, ho fanitsiana izay diso, ho fitaizana amin'ny fahamarinana…","Toute Écriture est inspirée de Dieu, et utile pour enseigner, pour convaincre, pour corriger, pour instruire dans la justice…"],"x":[[60,"1:20-21"],[18,"119:105"],[42,"17:17"],[57,"4:12"],[22,"8:20"]]},{"c":0,"t":{"fr":"La Trinité","mg":"Andriamanitra Telo Izay Iray"},"s":{"fr":"Il y a un seul Dieu : le Père, le Fils et le Saint-Esprit, trois personnes éternelles unies en un seul Dieu. Dieu est immortel, tout-puissant, il sait tout et il est présent partout. Il est amour, et il se fait connaître par ce qu'il a révélé de lui-même.","mg":"Andriamanitra iray ihany no misy : ny Ray, ny Zanaka ary ny Fanahy Masina, olona telo mandrakizay mitambatra ho Andriamanitra iray. Tsy mety maty Andriamanitra, tsitoha, mahalala ny zavatra rehetra ary manatrika eny rehetra eny. Fitiavana Izy, ary mampahafantatra ny tenany amin'izay nambarany."},"r":{"fr":"Un seul Dieu en trois personnes : le Père, le Fils et le Saint-Esprit.","mg":"Andriamanitra iray amin'ny olona telo : ny Ray, ny Zanaka ary ny Fanahy Masina."},"k":[39,28,19,"koa mandehana ianareo, dia ataovy mpianatra ny firenena rehetra, manao batisa azy ho amin'ny anaran'ny Ray sy ny Zanaka ary ny Fanahy Masina","Allez, faites de toutes les nations des disciples, les baptisant au nom du Père, du Fils et du Saint-Esprit…"],"x":[[4,"6:4"],[48,"4:4-6"],[59,"1:2"],[53,"1:17"]]},{"c":0,"t":{"fr":"Le Père","mg":"Andriamanitra Ray"},"s":{"fr":"Dieu le Père éternel est le Créateur, la source et le soutien de toute vie, et le souverain de l'univers. Il est juste et saint, compatissant et plein de grâce, lent à la colère et riche en bonté. Ce que Jésus et l'Esprit montrent de l'amour de Dieu révèle aussi le Père.","mg":"Andriamanitra Ray mandrakizay no Mpamorona, loharano sy mpitantana ny fiainana rehetra, ary mpanjakan'izao rehetra izao. Marina sy masina Izy, be fiantrana sy be fahasoavana, mahari-po ary be famindram-po. Izay asehon'i Jesosy sy ny Fanahy ny amin'ny fitiavan'Andriamanitra dia manambara ny Ray koa."},"r":{"fr":"Le Père est le Créateur, plein d'amour et de fidélité.","mg":"Ny Ray no Mpamorona, feno fitiavana sy fahatokiana."},"k":[42,3,16,"Fa toy izao no nitiavan' Andriamanitra izao tontolo izao: nomeny ny Zanani-lahy Tokana, mba tsy ho very izay rehetra mino Azy, fa hanana fiainana mandrakizay.","Car Dieu a tant aimé le monde qu’il a donné son Fils unique, afin que quiconque croit en lui ne périsse point, mais qu’il ait la vie éternelle."],"x":[[0,"1:1"],[1,"34:6-7"],[42,"14:9"],[61,"4:8"]]},{"c":0,"t":{"fr":"Le Fils","mg":"Andriamanitra Zanaka"},"s":{"fr":"Dieu le Fils éternel s'est fait homme en Jésus-Christ. Par lui tout a été créé ; il révèle le caractère de Dieu et accomplit le salut de l'humanité. Né de la vierge Marie, il a vécu sans péché, il est mort pour nos péchés, il est ressuscité, il intercède pour nous et il reviendra.","mg":"Andriamanitra Zanaka mandrakizay dia tonga nofo tao amin'i Jesosy Kristy. Tamin'ny alalany no nahariana ny zavatra rehetra ; Izy no manambara ny toetran'Andriamanitra sy manatanteraka ny famonjena ny olombelona. Teraky ny virjiny Maria Izy, niaina tsy nanota, maty noho ny fahotantsika, nitsangana tamin'ny maty, mifona ho antsika ary hiverina indray."},"r":{"fr":"Jésus est vrai Dieu et vrai homme : mon Sauveur.","mg":"Andriamanitra marina sy olona marina i Jesosy : Mpamonjy ahy."},"k":[42,1,14,"Ary ny Teny dia tonga nofo ka nonina tamintsika; ary hitanay ny voninahiny, dia voninahitra miendrika ho an'ny Lahitokana avy tamin'ny Ray, sady feno fahasoavana sy fahamarinana.","Et la parole a été faite chair, et elle a habité parmi nous, pleine de grâce et de vérité ; et nous avons contemplé sa gloire, une gloire comme la gloire du Fils unique venu du Père."],"x":[[42,"1:1-3"],[50,"1:15-19"],[49,"2:5-11"],[57,"4:15"]]},{"c":0,"t":{"fr":"Le Saint-Esprit","mg":"Andriamanitra Fanahy Masina"},"s":{"fr":"Le Saint-Esprit, Dieu éternel, a pris part à la création, à l'incarnation et à la rédemption. Il a inspiré les auteurs de la Bible. Il convainc de péché, transforme ceux qui répondent à son appel, les conduit dans la vérité et accorde des dons à l'Église.","mg":"Ny Fanahy Masina, Andriamanitra mandrakizay, dia niara-niasa tamin'ny famoronana, tamin'ny nahatongavan'i Kristy ho nofo ary tamin'ny fanavotana. Izy no nanentana ireo mpanoratra ny Baiboly. Izy no mampahatsiaro ny ota, manova izay mamaly ny antsony, mitarika azy ho amin'ny fahamarinana ary manome fanomezam-pahasoavana ho an'ny Fiangonana."},"r":{"fr":"L'Esprit me transforme et me guide dans la vérité.","mg":"Ny Fanahy no manova ahy sy mitarika ahy ho amin'ny fahamarinana."},"k":[42,16,13,"Fa raha tonga ny Fanahin'ny fahamarinana, dia Izy no hitari-dalana anareo ho amin'ny marina rehetra; fa tsy hiteny ho Azy Izy, fa izay ho reny dia holazainy avokoa; ary ny zavatra ho avy aza dia hambarany aminareo.","Quand le consolateur sera venu, l’Esprit de vérité, il vous conduira dans toute la vérité ; car il ne parlera pas de lui-même, mais il dira tout ce qu’il aura entendu, et il vous annoncera les choses à venir."],"x":[[0,"1:2"],[41,"1:35"],[42,"14:16-18"],[43,"1:8"],[44,"8:16"]]},{"c":1,"t":{"fr":"La création","mg":"Ny famoronana"},"s":{"fr":"Dieu est le Créateur de toutes choses, et la Bible rapporte fidèlement son œuvre. En six jours, le Seigneur a fait le ciel, la terre et tout ce qui vit, puis il s'est reposé le septième jour. Ce sabbat est le mémorial de la création. Tout ce que Dieu avait fait était très bon.","mg":"Andriamanitra no Mpamorona ny zavatra rehetra, ary ny Baiboly no mitantara amim-pahamarinana ny asany. Tao anatin'ny enina andro no nanaovan'ny Tompo ny lanitra sy ny tany ary izay rehetra velona, dia nitsahatra Izy tamin'ny andro fahafito. Io Sabata io no fahatsiarovana ny famoronana. Tsara indrindra ny zavatra rehetra nataon'Andriamanitra."},"r":{"fr":"Dieu a créé le monde en six jours et s'est reposé le septième.","mg":"Nahary izao tontolo izao tao anatin'ny enina andro Andriamanitra ary nitsahatra tamin'ny fahafito."},"k":[0,1,1,"Tamin'ny voalohany Andriamanitra nahary ny lanitra sy ny tany.","Au commencement, Dieu créa les cieux et la terre."],"x":[[0,"1:31"],[0,"2:1-3"],[1,"20:8-11"],[57,"11:3"]]},{"c":1,"t":{"fr":"La nature humaine","mg":"Ny toetran'ny olombelona"},"s":{"fr":"L'homme et la femme ont été créés à l'image de Dieu, libres de penser et d'agir, chacun formant une unité de corps, d'esprit et d'âme. Après la chute, cette image a été abîmée et tous sont devenus mortels. Mais en Christ, Dieu réconcilie le monde avec lui et restaure en nous son image.","mg":"Noharina araka ny endrik'Andriamanitra ny lehilahy sy ny vehivavy, afaka misaina sy mihetsika, ary samy iray tsy azo sarahina amin'ny vatana, saina ary fanahy. Taorian'ny fahalavoana dia simba io endrika io ary tonga mety maty ny rehetra. Fa ao amin'i Kristy, Andriamanitra no mampihavana izao tontolo izao aminy sy mamerina ny endriny ao amintsika."},"r":{"fr":"Créé à l'image de Dieu, je peux être restauré en Christ.","mg":"Noharina araka ny endrik'Andriamanitra aho, ary azo havaozina ao amin'i Kristy."},"k":[0,1,27,"Ary Andriamanitra nahary ny olona tahaka ny endriny; tahaka ny endrik'Andriamanitra no namoronany azy; lahy sy vavy no namoronany azy.","Dieu créa l’homme à son image, il le créa à l’image de Dieu, il créa l’homme et la femme."],"x":[[0,"2:7"],[44,"5:12-17"],[46,"5:19-20"],[43,"17:24-28"]]},{"c":2,"t":{"fr":"Le grand conflit","mg":"Ilay fifanandrinana lehibe"},"s":{"fr":"L'humanité entière est engagée dans un grand conflit entre le Christ et Satan, au sujet du caractère de Dieu, de sa loi et de son gouvernement. Ce conflit a commencé au ciel quand Satan s'est révolté, puis il s'est étendu à la terre. Dieu laisse la vérité se manifester et donnera la victoire finale au bien.","mg":"Ny olombelona rehetra dia tafiditra ao amin'ilay fifanandrinana lehibe eo amin'i Kristy sy Satana, momba ny toetran'Andriamanitra, ny lalàny ary ny fitondrany. Nanomboka tany an-danitra io fifanandrinana io rehefa nikomy i Satana, dia niitatra tety an-tany. Avelan'Andriamanitra hiseho ny fahamarinana, ary ho an'ny tsara ny fandresena farany."},"r":{"fr":"Le Christ a déjà vaincu : je choisis son camp.","mg":"Efa nandresy i Kristy : ny lafiny no safidiko."},"k":[65,12,9,"Ary nazera ilay dragona, dia ilay menarana ela, izay atao hoe devoly sy Satana, izay mamitaka izao tontolo izao; dia nazera tamin'ny tany izy, ary ny anjeliny koa niaraka nazera taminy.","Et il fut précipité, le grand dragon, le serpent ancien, appelé le diable et Satan, celui qui séduit toute la terre, il fut précipité sur la terre, et ses anges furent précipités avec lui."],"x":[[65,"12:7-9"],[22,"14:12-14"],[0,"3"],[48,"6:12"],[45,"4:9"]]},{"c":2,"t":{"fr":"La vie, la mort et la résurrection du Christ","mg":"Ny fiainan'i Kristy sy ny fahafatesany ary ny fitsanganany"},"s":{"fr":"Par la vie parfaite de Jésus, sa mort sur la croix et sa résurrection, Dieu a donné le seul moyen d'expier le péché. Ceux qui l'acceptent par la foi reçoivent la vie éternelle. Sa mort révèle à la fois la justice et l'amour de Dieu ; sa résurrection proclame sa victoire sur le mal et sur la mort.","mg":"Tamin'ny fiainana lavorarin'i Jesosy, ny nahafatesany teo amin'ny hazo fijaliana ary ny nitsanganany tamin'ny maty no nanomezan'Andriamanitra ny lalana tokana hanavotana ny ota. Izay manaiky Azy amin'ny finoana dia mahazo fiainana mandrakizay. Ny fahafatesany no manambara ny fahamarinana sy ny fitiavan'Andriamanitra ; ny fitsanganany kosa no manambara ny fandreseny ny ratsy sy ny fahafatesana."},"r":{"fr":"Jésus est mort pour moi, et il est vivant.","mg":"Maty ho ahy i Jesosy, ary velona Izy."},"k":[45,15,3,"Fa natolotro anareo ho isan'ny zavatra voalohany indrindra ilay noraisiko, dia izao: Kristy maty noho ny fahotantsika araka ny Soratra Masina…","Je vous ai enseigné avant tout, comme je l’avais aussi reçu, que Christ est mort pour nos péchés, selon les Écritures…"],"x":[[22,"53"],[44,"3:25"],[46,"5:17-21"],[49,"2:6-11"]]},{"c":2,"t":{"fr":"L'expérience du salut","mg":"Ny famonjena sy ny fanamarinana ary ny fanamasinana"},"s":{"fr":"Dans son amour infini, Dieu a fait du Christ, qui n'a pas connu le péché, le porteur de nos péchés. Guidés par l'Esprit, nous reconnaissons notre besoin, nous nous repentons et nous acceptons Jésus par la foi. Nous sommes alors justifiés, adoptés comme enfants de Dieu et libérés de la domination du péché. Le salut est un don de la grâce, pas le fruit de nos œuvres.","mg":"Noho ny fitiavany tsy hita fetra, Andriamanitra dia nanao an'i Kristy, Izay tsy nahalala ota, ho mpitondra ny fahotantsika. Tarihin'ny Fanahy, dia ekentsika fa mila Azy isika, mibebaka ary mandray an'i Jesosy amin'ny finoana. Dia hamarinina isika, raisina ho zanak'Andriamanitra ary afaka amin'ny fanjakan'ny ota. Fanomezana avy amin'ny fahasoavana ny famonjena, fa tsy vokatry ny asantsika."},"r":{"fr":"Je suis sauvé par grâce, par la foi en Jésus.","mg":"Voavonjy noho ny fahasoavana aho, amin'ny finoana an'i Jesosy."},"k":[48,2,8,"Fa fahasoavana no namonjena anareo amin'ny finoana; ary tsy avy aminareo izany, fa fanomezana avy amin'Andriamanitra…","Car c’est par la grâce que vous êtes sauvés, par le moyen de la foi. Et cela ne vient pas de vous, c’est le don de Dieu."],"x":[[42,"3:3-8"],[44,"3:21-26"],[46,"5:21"],[47,"3:13-14"],[55,"3:3-7"]]},{"c":2,"t":{"fr":"Croître en Christ","mg":"Mitombo ao amin'i Kristy"},"s":{"fr":"Par sa mort sur la croix, Jésus a vaincu les forces du mal. Il nous libère de la peur, de la culpabilité et de l'emprise du mal. Nous grandissons en lui par la prière, l'étude de la Bible, la louange, la communion fraternelle et le service, sous la conduite du Saint-Esprit.","mg":"Tamin'ny nahafatesany teo amin'ny hazo fijaliana no nandresen'i Jesosy ny herin'ny ratsy. Manafaka antsika amin'ny tahotra, amin'ny fahatsiarovan-keloka ary amin'ny fanjakazakan'ny ratsy Izy. Mitombo ao aminy isika amin'ny vavaka, ny fandalinana ny Baiboly, ny fiderana, ny fiombonana ary ny fanompoana, tarihin'ny Fanahy Masina."},"r":{"fr":"Je grandis chaque jour avec Jésus : prière, Bible, service.","mg":"Mitombo isan'andro miaraka amin'i Jesosy aho : vavaka, Baiboly, fanompoana."},"k":[60,3,18,"fa mitomboa amin'ny fahasoavana sy ny fahalalana an'i Jesosy Kristy, Tompontsika sy Mpamonjy. Ho Azy anie ny voninahitra ankehitriny sy mandrakizay. Amena.","Mais croissez dans la grâce et dans la connaissance de notre Seigneur et Sauveur Jésus-Christ. A lui soit la gloire, maintenant et pour l’éternité ! Amen !"],"x":[[50,"2:15"],[49,"3:7-14"],[47,"5:22-25"],[44,"8:38-39"],[48,"6:12-18"]]},{"c":3,"t":{"fr":"L'Église","mg":"Ny Fiangonana"},"s":{"fr":"L'Église est la communauté des croyants qui confessent Jésus-Christ comme Seigneur et Sauveur. Ils se réunissent pour adorer, s'encourager les uns les autres, célébrer la sainte cène, servir et annoncer l'Évangile au monde entier. Le Christ en est la tête.","mg":"Ny Fiangonana dia fiaraha-monin'ireo mpino manaiky an'i Jesosy Kristy ho Tompo sy Mpamonjy. Mivory izy ireo mba hivavaka, hifampahery, hanao ny Fanasan'ny Tompo, hanompo ary hitory ny Filazantsara amin'izao tontolo izao. I Kristy no lohany."},"r":{"fr":"L'Église est la famille de Dieu ; le Christ en est la tête.","mg":"Fianakavian'Andriamanitra ny Fiangonana ; i Kristy no lohany."},"k":[39,16,18,"Ary Izaho milaza aminao koa: Hianao no Petera, ary ambonin'ity vatolampy ity no haoriko ny fiangonako; ary ny vavahadin'ny fiainan-tsi-hita tsy haharesy azy.","Et moi, je te dis que tu es Pierre, et que sur cette pierre je bâtirai mon Église, et que les portes du séjour des morts ne prévaudront point contre elle."],"x":[[39,"28:19-20"],[43,"2:38-42"],[48,"4:11-15"],[50,"1:17-18"]]},{"c":3,"t":{"fr":"Le reste et sa mission","mg":"Ny sisa sy ny nanirahana azy"},"s":{"fr":"L'Église universelle comprend tous ceux qui croient vraiment au Christ. Dans les derniers jours, un reste est appelé à garder les commandements de Dieu et la foi de Jésus, et à annoncer à tous les peuples le message des trois anges d'Apocalypse 14 : l'heure du jugement est venue, et le retour du Christ est proche.","mg":"Ny Fiangonana manerantany dia ahitana izay rehetra tena mino an'i Kristy. Amin'ny andro farany, misy sisa antsoina hitandrina ny didin'Andriamanitra sy ny finoana an'i Jesosy, ary hitory amin'ny firenena rehetra ny hafatry ny anjely telo ao amin'ny Apokalypsy 14 : tonga ny ora fitsarana, ary efa akaiky ny fiverenan'i Kristy."},"r":{"fr":"Annoncer à tous le message des trois anges.","mg":"Mitory amin'ny olona rehetra ny hafatry ny anjely telo."},"k":[65,14,12,"Indro ny faharetan'ny olona masina, dia izay mitandrina ny didin'Andriamanitra sy ny finoana an'i Jesosy.","C’est ici la persévérance des saints, qui gardent les commandements de Dieu et la foi de Jésus."],"x":[[65,"14:6-12"],[65,"12:17"],[39,"28:18-20"],[46,"5:10"]]},{"c":3,"t":{"fr":"L'unité dans le corps du Christ","mg":"Firaisana ao amin'ny tenan'i Kristy"},"s":{"fr":"L'Église est un seul corps, formé de membres de toutes nations, races, langues et conditions. En Christ, nous sommes une nouvelle création : nos différences ne doivent pas nous diviser. Cette unité vient du Saint-Esprit et témoigne au monde de l'amour de Dieu.","mg":"Tena iray ny Fiangonana, misy mpikambana avy amin'ny firenena, foko, fiteny ary toe-piainana rehetra. Ao amin'i Kristy dia olom-baovao isika : tsy tokony hampisaraka antsika ny fahasamihafantsika. Avy amin'ny Fanahy Masina io firaisana io, ary manambara ny fitiavan'Andriamanitra amin'izao tontolo izao."},"r":{"fr":"En Christ, nous sommes un, malgré nos différences.","mg":"Iray isika ao amin'i Kristy, na dia samy hafa aza."},"k":[47,3,28,"Tsy misy intsony na Jiosy na Grika, na andevo na tsy andevo, na lahy sy vavy; fa iray ihany ianareo rehetra ao amin'i Kristy Jesosy.","Il n’y a plus ni Juif ni Grec, il n’y a plus ni esclave ni libre, il n’y a plus ni homme ni femme ; car tous vous êtes un en Jésus-Christ."],"x":[[42,"17:20-23"],[48,"4:3-6"],[44,"12:4-5"],[45,"12:12-14"]]},{"c":3,"t":{"fr":"Le baptême","mg":"Ny batisa"},"s":{"fr":"Par le baptême, nous confessons notre foi en la mort et la résurrection de Jésus, nous témoignons que nous sommes morts au péché et que nous voulons vivre une vie nouvelle. Il se fait par immersion, après un enseignement biblique, et marque l'entrée dans la famille de l'Église.","mg":"Amin'ny batisa no anekenantsika ny finoantsika ny fahafatesan'i Jesosy sy ny fitsanganany tamin'ny maty, sady ambarantsika fa maty amin'ny ota isika ary te hiaina fiainana vaovao. Atao amin'ny fanentsehana izy, aorian'ny fampianarana ara-baiboly, ary manamarika ny fidirana ao amin'ny fianakavian'ny Fiangonana."},"r":{"fr":"Baptême par immersion : mourir au péché, naître à une vie nouvelle.","mg":"Batisa amin'ny fanentsehana : maty amin'ny ota, teraka ho amin'ny fiainana vaovao."},"k":[44,6,4,"Koa niara-nalevina taminy tamin'ny batisa ho amin'ny fahafatesana isika, mba ho tahaka ny nananganana an'i Kristy tamin'ny maty tamin'ny voninahitry ny Ray no handehanantsika kosa amin'ny fiainam-baovao.","Nous avons donc été ensevelis avec lui par le baptême en sa mort, afin que, comme Christ est ressuscité des morts par la gloire du Père, de même nous aussi nous marchions en nouveauté de vie."],"x":[[39,"28:19-20"],[43,"2:38"],[50,"2:12-13"],[43,"22:16"]]},{"c":3,"t":{"fr":"La sainte cène","mg":"Ny fandraisana ny Fanasan'ny Tompo"},"s":{"fr":"La sainte cène est une participation au corps et au sang de Jésus, représentés par le pain et le fruit de la vigne, pour exprimer notre foi en lui. Elle rappelle sa mort et annonce son retour. Elle est précédée du lavement des pieds, signe d'humilité, de service et de réconciliation. Elle est ouverte à tous les croyants.","mg":"Ny Fanasan'ny Tompo dia fandraisana ny tenan'i Jesosy sy ny ràny, asehon'ny mofo sy ny vokatry ny voaloboka, mba hanehoana ny finoantsika Azy. Mampahatsiahy ny fahafatesany izy ary manambara ny fiverenany. Alohan'izany dia misy ny fanasana tongotra, mariky ny fanetren-tena, ny fanompoana ary ny fihavanana. Malalaka ho an'ny mpino rehetra izy."},"r":{"fr":"Le pain, la coupe et le lavement des pieds : souvenir, humilité, espérance.","mg":"Ny mofo, ny kapoaka ary ny fanasana tongotra : fahatsiarovana, fanetren-tena, fanantenana."},"k":[45,11,26,"Fa na oviana na oviana ianareo no mihinana itony mofo itony sy misotro amin'ny kapoaka, dia manambara ny fahafatesan'ny Tompo ianareo mandra-pihaviny.","Car toutes les fois que vous mangez ce pain et que vous buvez cette coupe, vous annoncez la mort du Seigneur, jusqu’à ce qu’il vienne."],"x":[[39,"26:17-30"],[42,"13:1-17"],[45,"10:16-17"],[45,"11:23-30"]]},{"c":3,"t":{"fr":"Les dons spirituels et les ministères","mg":"Ny fanomezam-pahasoavana"},"s":{"fr":"Dieu accorde à chaque membre de l'Église des dons spirituels, que chacun doit mettre au service des autres. Le Saint-Esprit les distribue comme il veut : enseignement, service, encouragement, accueil, direction et bien d'autres. Bien utilisés, ces dons font grandir l'Église et la rendent capable d'accomplir sa mission.","mg":"Manome fanomezam-pahasoavana ho an'ny mpikambana tsirairay ao amin'ny Fiangonana Andriamanitra, ka samy tokony hampiasa izany hanompoana ny hafa. Ny Fanahy Masina no mizara izany araka ny sitrapony : fampianarana, fanompoana, fampaherezana, fandraisana vahiny, fitarihana sy ny maro hafa. Raha ampiasaina tsara, dia mampitombo ny Fiangonana ireo fanomezana ireo ary mahatonga azy hahavita ny irany."},"r":{"fr":"J'ai reçu un don : je le mets au service des autres.","mg":"Nahazo fanomezana aho : ampiasaiko hanompoana ny hafa."},"k":[59,4,10,"Samia mifanompo araka ny fanomezam-pahasoavana izay noraisinareo, dia tahaka ny mpitandrina tsara ny fahasoavana maro samy hafa izay an'Andriamanitra.","Comme de bons dispensateurs des diverses grâces de Dieu, que chacun de vous mette au service des autres le don qu’il a reçu…"],"x":[[44,"12:4-8"],[45,"12:4-11"],[48,"4:11-16"]]},{"c":3,"t":{"fr":"Le don de prophétie","mg":"Ny fanomezam-pahasoavan'ny faminaniana"},"s":{"fr":"La Bible annonce que le don de prophétie se manifesterait dans l'Église des derniers jours. Les adventistes reconnaissent ce don dans le ministère d'Ellen G. White, dont les écrits réconfortent, guident et instruisent l'Église. La Bible reste la norme par laquelle tout enseignement et toute expérience doivent être éprouvés.","mg":"Milaza ny Baiboly fa hiseho ao amin'ny Fiangonan'ny andro farany ny fanomezam-pahasoavan'ny faminaniana. Manaiky ny Advantista fa hita tao amin'ny asan'i Ellen G. White io fanomezana io, ary ny asa sorany dia mampionona, mitarika ary mampianatra ny Fiangonana. Ny Baiboly no mijanona ho fitsipika itsapana ny fampianarana sy ny traikefa rehetra."},"r":{"fr":"Le don de prophétie guide l'Église ; la Bible reste la norme.","mg":"Mitarika ny Fiangonana ny fanomezam-pahasoavan'ny faminaniana ; ny Baiboly no fitsipika."},"k":[29,3,7,"Tsy manao na inona na inona tokoa Jehovah Tompo, raha tsy milaza ny heviny amin'ny mpaminany mpanompony.","Car le Seigneur, l’Éternel, ne fait rien Sans avoir révélé son secret à ses serviteurs les prophètes."],"x":[[43,"2:14-21"],[65,"12:17"],[65,"19:10"],[57,"1:1-3"],[51,"5:19-21"]]},{"c":4,"t":{"fr":"La loi de Dieu","mg":"Ny lalàn'Andriamanitra"},"s":{"fr":"Les grands principes de la loi de Dieu sont résumés dans les dix commandements et illustrés par la vie du Christ. Ils expriment l'amour de Dieu, sa volonté et ses desseins pour la conduite humaine. L'obéissance ne sauve pas, mais elle est le fruit du salut : celui qui aime Dieu garde ses commandements.","mg":"Ny fotokevitra lehibe amin'ny lalàn'Andriamanitra dia voafintina ao amin'ny Didy Folo ary aseho amin'ny fiainan'i Kristy. Manambara ny fitiavan'Andriamanitra, ny sitrapony ary ny fikasany amin'ny fitondran-tenan'ny olombelona izy ireo. Tsy mamonjy ny fankatoavana, fa vokatry ny famonjena : izay tia an'Andriamanitra dia mitandrina ny didiny."},"r":{"fr":"J'obéis par amour, pas pour être sauvé.","mg":"Mankato noho ny fitiavana aho, fa tsy mba hahazoana famonjena."},"k":[42,14,15,"Raha tia Ahy ianareo, dia hitandrina ny didiko.","Si vous m’aimez, gardez mes commandements."],"x":[[1,"20:1-17"],[39,"5:17-20"],[44,"8:3-4"],[61,"5:3"]]},{"c":4,"t":{"fr":"Le sabbat","mg":"Ny Sabata"},"s":{"fr":"Après avoir créé le monde en six jours, Dieu s'est reposé le septième jour et l'a béni. Le sabbat, du coucher du soleil le vendredi au coucher du soleil le samedi, est un jour de repos, de culte et de service, à l'exemple de Jésus. Il est le signe de notre relation avec Dieu, Créateur et Rédempteur.","mg":"Rehefa nahary izao tontolo izao tao anatin'ny enina andro Andriamanitra, dia nitsahatra tamin'ny andro fahafito ary nitahy azy. Ny Sabata, manomboka amin'ny filentehan'ny masoandro Zoma ka hatramin'ny filentehan'ny masoandro Asabotsy, dia andro fitsaharana, fivavahana ary fanompoana, araka ny ohatra nomen'i Jesosy. Mariky ny fifandraisantsika amin'Andriamanitra, Mpamorona sy Mpanavotra, izy."},"r":{"fr":"Du vendredi soir au samedi soir : un jour avec Dieu.","mg":"Hatramin'ny hariva Zoma ka hatramin'ny hariva Asabotsy : andro iray miaraka amin'Andriamanitra."},"k":[1,20,8,"Mahatsiarova ny andro Sabata hanamasi-na azy.","Souviens-toi du jour du repos, pour le sanctifier."],"x":[[0,"2:1-3"],[1,"20:8-11"],[40,"2:27-28"],[22,"58:13-14"],[41,"4:16"],[57,"4:9-10"]]},{"c":4,"t":{"fr":"La gestion chrétienne de la vie","mg":"Fitantanam-piainana kristiana"},"s":{"fr":"Nous sommes les intendants de Dieu : il nous a confié le temps, les talents, les biens, la santé et les ressources de la terre. Nous reconnaissons qu'il en est le propriétaire en servant fidèlement et en rendant la dîme et des offrandes pour soutenir l'annonce de l'Évangile.","mg":"Mpitantana ny fananan'Andriamanitra isika : Izy no nanankina amintsika ny fotoana, ny talenta, ny fananana, ny fahasalamana ary ny harenan'ny tany. Ekentsika fa Azy ireo amin'ny fanompoana amim-pahatokiana, sy amin'ny fanomezana ny ampahafolony sy ny fanatitra hanohanana ny fitoriana ny Filazantsara."},"r":{"fr":"Tout appartient à Dieu : je gère fidèlement ce qu'il me confie.","mg":"An'Andriamanitra ny zavatra rehetra : tantaniko amim-pahatokiana izay ankininy amiko."},"k":[38,3,10,"Entonareo ny fahafolon-karena rehetra ho ao amin'ny trano firaketako, mba hasian-kanina ao an-tranoko, ary izahao toetra amin'izany Aho, hoy Jehovah, Tompon'ny maro, raha tsy hovohako ny varavaran'ny lanitra ho anareo ka hampidinako fitahiana manana amby ampy ho anareo.","Apportez à la maison du trésor toutes les dîmes, Afin qu’il y ait de la nourriture dans ma maison ; Mettez-moi de la sorte à l’épreuve, Dit l’Éternel des armées. Et vous verrez si je n’ouvre pas pour vous les écluses des cieux, Si je ne répands pas sur vous la bénédiction en abondance."],"x":[[0,"1:26-28"],[12,"29:14"],[39,"23:23"],[46,"8:1-15"],[46,"9:7"]]},{"c":4,"t":{"fr":"La conduite chrétienne","mg":"Ny toetra sy ny fihetsika kristiana"},"s":{"fr":"Nous sommes appelés à vivre selon les principes du ciel dans tous les domaines de la vie. Notre corps est le temple du Saint-Esprit : nous en prenons soin par l'exercice, le repos et une alimentation saine, et nous évitons l'alcool, le tabac, les drogues et les aliments impurs. Nos choix de tenue, de loisirs et de pensées cherchent à honorer Dieu.","mg":"Antsoina isika hiaina araka ny fitsipiky ny lanitra amin'ny lafim-piainana rehetra. Tempolin'ny Fanahy Masina ny vatantsika : karakaraintsika amin'ny fanatanjahan-tena, ny fitsaharana ary ny sakafo mahasalama, ary ialantsika ny toaka, ny sigara, ny zava-mahadomelina ary ny sakafo tsy madio. Ny safidintsika amin'ny fitafiana, ny fialam-boly ary ny eritreritra dia mikendry ny hanome voninahitra an'Andriamanitra."},"r":{"fr":"Mon corps est le temple du Saint-Esprit.","mg":"Tempolin'ny Fanahy Masina ny vatako."},"k":[45,6,19,"Ahoana ary? Moa tsy fantatrareo fa ny tenanareo dia tempolin'ny Fanahy Masina, Izay ao anatinareo sady efa azonareo tamin'Andriamanitra? ka tsy tompon'ny tenanareo ianareo.","Ne savez-vous pas que votre corps est le temple du Saint-Esprit qui est en vous, que vous avez reçu de Dieu, et que vous ne vous appartenez point à vous-mêmes ?"],"x":[[45,"10:31"],[44,"12:1-2"],[49,"4:8"],[63,"2"],[2,"11"]]},{"c":4,"t":{"fr":"Le mariage et la famille","mg":"Ny fanambadiana sy ny ankohonana"},"s":{"fr":"Le mariage a été institué par Dieu en Éden : c'est l'union à vie d'un homme et d'une femme, dans l'amour et la fidélité. Les parents élèvent leurs enfants dans l'amour du Seigneur et l'obéissance à sa Parole. La famille est le lieu où l'on apprend à aimer comme Dieu aime.","mg":"Andriamanitra no nanorina ny fanambadiana tany Edena : fikambanan'ny lehilahy iray sy vehivavy iray mandritra ny fiainana, amim-pitiavana sy fahatokiana. Mitaiza ny zanany amin'ny fitiavana ny Tompo sy ny fankatoavana ny Teniny ny ray aman-dreny. Ny ankohonana no toerana ianarana ny fitiavana toy ny fitiavan'Andriamanitra."},"r":{"fr":"La famille, école de l'amour de Dieu.","mg":"Ny ankohonana, sekolin'ny fitiavan'Andriamanitra."},"k":[0,2,24,"Ary noho izany ny lehilahy dia handao ny rainy sy ny reniny ka hikambana amin'ny vadiny; dia ho nofo iray ihany ireo.","C’est pourquoi l’homme quittera son père et sa mère, et s’attachera à sa femme, et ils deviendront une seule chair."],"x":[[39,"19:3-9"],[48,"5:21-33"],[1,"20:12"],[4,"6:5-9"],[48,"6:1-4"]]},{"c":5,"t":{"fr":"Le ministère du Christ dans le sanctuaire céleste","mg":"Ny asan'i Kristy ao amin'ny fitoerana masina any an-danitra"},"s":{"fr":"Il y a un sanctuaire dans le ciel, dressé par le Seigneur. Le Christ y exerce son ministère en notre faveur, comme notre souverain sacrificateur. En 1844, à la fin des 2300 jours, il est entré dans la dernière phase de ce ministère : le jugement, qui précède son retour et révèle ceux qui demeurent en lui.","mg":"Misy fitoerana masina any an-danitra, naorin'ny Tompo. Ao no anaovan'i Kristy ny asany ho antsika, amin'ny maha-Mpisoronabentsika Azy. Tamin'ny 1844, tamin'ny fiafaran'ny andro 2300, dia niditra tamin'ny dingana farany amin'io asa io Izy : ny fitsarana, izay mialoha ny fiverenany sy manambara izay mitoetra ao aminy."},"r":{"fr":"Jésus intercède pour moi dans le sanctuaire céleste.","mg":"Mifona ho ahy ao amin'ny fitoerana masina any an-danitra i Jesosy."},"k":[57,8,1,"Ary amin'izany zavatra lazainay izany dia izao no fotony: Manana Mpisoronabe toy izany isika, dia Ilay efa mipetraka eo amin'ny ankavanan'ny seza fiandrianan'ny Avo Indrindra any an-danitra…","Le point capital de ce qui vient d’être dit, c’est que nous avons un tel souverain sacrificateur, qui s’est assis à la droite du trône de la majesté divine dans les cieux…"],"x":[[57,"8:1-2"],[26,"8:14"],[57,"9:11-28"],[2,"16"],[65,"14:6-7"]]},{"c":5,"t":{"fr":"Le retour du Christ","mg":"Ny fiavian'i Kristy fanindroany"},"s":{"fr":"Le retour du Christ est la bienheureuse espérance de l'Église. Il sera personnel, visible et glorieux. À son retour, les justes morts ressusciteront et, avec les justes vivants, ils seront enlevés au ciel. L'accomplissement des prophéties montre que ce retour est proche : nous devons être prêts en tout temps.","mg":"Ny fiverenan'i Kristy no fanantenana mahafinaritra ho an'ny Fiangonana. Ho avy Izy ka ho hita maso sy amin'ny voninahitra. Rehefa miverina Izy, dia hitsangana ireo marina efa maty, ary miaraka amin'ireo marina mbola velona dia ho entina any an-danitra. Ny fahatanterahan'ny faminaniana no mampiseho fa efa akaiky io fiverenana io : tokony ho vonona mandrakariva isika."},"r":{"fr":"Jésus revient bientôt : je veux être prêt.","mg":"Ho avy tsy ho ela i Jesosy : te ho vonona aho."},"k":[42,14,3,"Ary raha handeha hamboatra fitoerana ho anareo Aho, dia ho avy indray ka handray anareo ho any amiko, ka izay itoerako no hitoeranareo koa.","Et, lorsque je m’en serai allé, et que je vous aurai préparé une place, je reviendrai, et je vous prendrai avec moi, afin que là où je suis vous y soyez aussi."],"x":[[43,"1:9-11"],[55,"2:13"],[51,"4:13-18"],[65,"1:7"],[39,"24:30-31"]]},{"c":5,"t":{"fr":"La mort et la résurrection","mg":"Ny fahafatesana sy ny fitsanganana amin'ny maty"},"s":{"fr":"Le salaire du péché, c'est la mort ; mais Dieu, qui seul possède l'immortalité, donnera la vie éternelle à ses rachetés. D'ici là, la mort est comme un sommeil sans conscience. Au retour du Christ, les justes ressusciteront et recevront l'immortalité ; la seconde résurrection, celle des méchants, aura lieu mille ans plus tard.","mg":"Fahafatesana no tambin'ny ota ; fa Andriamanitra, Izay tokana manana ny tsy fahafatesana, no hanome fiainana mandrakizay ho an'ireo voavonjiny. Mandra-pahatongan'izany, ny fahafatesana dia toy ny torimaso tsy misy fahatsiarovan-tena. Rehefa miverina i Kristy, dia hitsangana ireo marina ka hahazo ny tsy fahafatesana ; ny fitsanganana faharoa, an'ny ratsy fanahy, kosa dia ho arivo taona aty aoriana."},"r":{"fr":"La mort est un sommeil ; Jésus réveillera les siens.","mg":"Torimaso ny fahafatesana ; hofohazin'i Jesosy ny azy."},"k":[42,5,28,"Aza gaga amin'izany; fa avy ny andro izay handrenesan'ny olona rehetra any am-pasana ny feony…","Ne vous étonnez pas de cela ; car l’heure vient où tous ceux qui sont dans les sépulcres entendront sa voix, et en sortiront."],"x":[[44,"6:23"],[20,"9:5-6"],[51,"4:13-17"],[45,"15:51-54"],[65,"20:1-10"]]},{"c":5,"t":{"fr":"Le millénium et la fin du péché","mg":"Ny arivo taona sy ny famaranana ny fahotana"},"s":{"fr":"Le millénium est la période de mille ans qui suit le retour du Christ : les rachetés règnent avec lui au ciel et participent au jugement, tandis que la terre est désolée et que Satan y est lié. À la fin, le Christ descend avec la sainte cité ; les méchants ressuscitent, sont jugés et détruits avec Satan. Le péché et les pécheurs disparaissent pour toujours.","mg":"Ny arivo taona dia fotoana manaraka ny fiverenan'i Kristy : miara-manjaka aminy any an-danitra ireo voavonjy ary mandray anjara amin'ny fitsarana, raha foana kosa ny tany ary voafatotra eo i Satana. Amin'ny farany, midina miaraka amin'ny tanàna masina i Kristy ; hitsangana ny ratsy fanahy, hotsaraina ary horinganina miaraka amin'i Satana. Hanjavona mandrakizay ny ota sy ny mpanota."},"r":{"fr":"Après mille ans, le mal disparaîtra pour toujours.","mg":"Aorian'ny arivo taona, hanjavona mandrakizay ny ratsy."},"k":[65,20,6,"Sambatra sy masina izay manana anjara amin'ny fitsanganana voalohany; ireo tsy mba ananan'ny fahafatesana faharoa fahefana, fa ho mpisoron'Andriamanitra sy Kristy ireo ka hiara-manjaka aminy arivo taona.","Heureux et saints ceux qui ont part à la première résurrection ! La seconde mort n’a point de pouvoir sur eux ; mais ils seront sacrificateurs de Dieu et de Christ, et ils régneront avec lui pendant mille ans."],"x":[[65,"20:1-10"],[23,"4:23-26"],[65,"21:1-5"],[45,"6:2-3"]]},{"c":5,"t":{"fr":"La nouvelle terre","mg":"Ny tany vaovao"},"s":{"fr":"Sur la nouvelle terre, où la justice habitera, Dieu offrira aux rachetés une demeure éternelle et un monde parfait, pour la vie, l'amour, la joie et la connaissance de Dieu. Dieu lui-même habitera avec son peuple. Il n'y aura plus ni souffrance ni mort. Le grand conflit sera terminé, et tout l'univers proclamera que Dieu est amour.","mg":"Ao amin'ny tany vaovao, izay honenan'ny fahamarinana, dia hanome fonenana mandrakizay sy tontolo lavorary ho an'ireo voavonjy Andriamanitra, ho amin'ny fiainana, ny fitiavana, ny fifaliana ary ny fahalalana Azy. Andriamanitra mihitsy no honina miaraka amin'ny olony. Tsy hisy fijaliana na fahafatesana intsony. Ho tapitra ilay fifanandrinana lehibe, ary hanambara izao rehetra izao fa fitiavana Andriamanitra."},"r":{"fr":"Dieu habitera avec nous : plus de larmes, plus de mort.","mg":"Hiara-honina amintsika Andriamanitra : tsy hisy ranomaso na fahafatesana intsony."},"k":[65,21,4,"Ary hofafany ny ranomaso rehetra amin'ny masony; ary tsy hisy fahafatesana intsony, sady tsy hisy alahelo, na fitarainana, na fanaintainana; fa efa lasa ny zavatra taloha.","Il essuiera toute larme de leurs yeux, et la mort ne sera plus, et il n’y aura plus ni deuil, ni cri, ni douleur, car les premières choses ont disparu."],"x":[[60,"3:13"],[22,"35"],[22,"65:17-25"],[39,"5:5"],[65,"21:1-7"]]}];

  return HID.map(h => `<div class="card"><h3 style="margin-top:0">${esc(L(h.t))}</h3><ol class="ndsteps">${L(h.s).map(x => `<li>${esc(x)}</li>`).join("")}</ol>${h.x ? `<div class="ndwarn">${esc(L(h.x))}</div>` : ""}${h.go ? `<button class="btn" data-act="gocx">${t("cxGo")}</button>` : ""}</div>`).join("");
}
function cxAct(a, b) {
  const v = b.dataset.v;
  if (a === "cx") { st.cx = v; st.cxr = false; save("cx", v); render(); }
  else if (a === "cxk") { st.cxk = +v; save("cxk", v); render(); }
  else if (a === "cxd") { st.cxd = v; render(); }
  else if (a === "cxr") { st.cxr = !st.cxr; render(); }
  else if (a === "cxn") { st.cxw++; st.cxr = false; render(); }
  else if (a === "cxcopy") { const d = st.cxd === "dec"; copy(CXF[st.cx][d ? "d" : "e"](d ? st.cxc : st.cxt)); }
  else if (a === "semr") { st.semr = !st.semr; render(); }
  else if (a === "semn") { st.semw++; st.semr = false; render(); }
  else if (a === "gocx") { st.tab.morse = "codes"; go("morse"); }
}
document.addEventListener("input", e => {
  if (e.target.id === "cxin") { const dec = st.cxd === "dec" && st.cx !== "pigpen"; if (dec) st.cxc = e.target.value; else st.cxt = e.target.value; const o = document.getElementById("cxout"); if (o) o.innerHTML = cxOut(st.cx, e.target.value, dec) || "&nbsp;"; }
  else if (e.target.id === "semin") { st.semt = e.target.value; const o = document.getElementById("semout"); if (o) o.innerHTML = semRow(st.semt); }
});
document.addEventListener("change", e => { if (e.target.id === "cxsel") { st.cxk = +e.target.value; save("cxk", st.cxk); render(); } });

 nords:{fr:["Le nord géographique : le pôle Nord, autour duquel la Terre tourne.","Le nord magnétique : là où pointe l'aiguille de la boussole. Il se déplace lentement.","Le nord de la carte : le haut de la carte, parallèle à ses bords.","L'écart entre le nord géographique et le nord magnétique s'appelle la déclinaison. À Madagascar, elle n'est pas négligeable : lis sa valeur et son sens (est ou ouest) au bord de ta carte."],mg:["Ny avaratra ara-jeografia : ny tendrontany avaratra, izay ihodinan'ny tany.","Ny avaratra magnetika : izay tondroin'ny fanjaitry ny boussole. Mihetsika miadana izy.","Ny avaratry ny sarintany : ny ambony amin'ny sarintany, mitovy làlana amin'ny sisiny.","Ny elanelana eo amin'ny avaratra ara-jeografia sy ny avaratra magnetika dia antsoina hoe déclinaison. Eto Madagasikara dia tsy azo tsinontsinoavina izany : vakio eo amin'ny sisin'ny sarintanao ny habeny sy ny lafiny (atsinanana na andrefana)."]},
 sun:{fr:"Le soleil se lève à l'est et se couche à l'ouest. À Madagascar (hémisphère sud), la plus grande partie de l'année, il est au nord à midi : ton ombre de midi montre alors le sud. Vers décembre et janvier, il passe presque au-dessus de ta tête : la méthode n'est plus fiable.",mg:"Miposaka any atsinanana ny masoandro ary milentika any andrefana. Eto Madagasikara (ilany atsimon'ny tany), mandritra ny ankamaroan'ny taona, dia any avaratra izy rehefa mitataovovonana : ny alokao amin'izay fotoana izay no manondro ny atsimo. Manodidina ny volana desambra sy janoary, dia saika eo ambonin'ny lohanao izy : tsy azo antoka intsony izany fomba izany."},
 stick:{fr:["Plante un bâton bien droit dans un sol plat.","Marque le bout de l'ombre avec un caillou (1).","Attends 15 à 20 minutes, puis marque le nouveau bout de l'ombre (2).","La ligne du caillou 1 au caillou 2 va de l'ouest vers l'est. Une ligne perpendiculaire donne le nord et le sud."],mg:["Atsatoka amin'ny tany fisaka ny tsorakazo mahitsy tsara.","Mariho vato ny tendron'ny aloka (1).","Miandrasa 15 ka hatramin'ny 20 minitra, dia mariho ny tendron'ny aloka vaovao (2).","Ny tsipika avy amin'ny vato 1 mankany amin'ny vato 2 dia mandeha avy any andrefana mankany atsinanana. Ny tsipika mitsangana mahitsy amin'izany no manome ny avaratra sy ny atsimo."]},
 watch:{fr:"Avec une montre à aiguilles, dans l'hémisphère sud : pointe le 12 vers le soleil. Le nord est au milieu du plus petit angle entre le 12 et la petite aiguille. C'est une méthode approximative.",mg:"Amin'ny famantaranandro misy fanjaitra, any amin'ny ilany atsimon'ny tany : atondrohy any amin'ny masoandro ny 12. Ny avaratra dia eo afovoan'ny zoro kely indrindra eo anelanelan'ny 12 sy ny fanjaitra fohy. Fomba manodidina ihany izany."},

 coord:{fr:"La latitude dit à quelle distance on est de l'équateur, vers le nord ou le sud (de 0° à 90°). La longitude dit à quelle distance on est du méridien de Greenwich, vers l'est ou l'ouest (de 0° à 180°). Exemple : Toliara se trouve à environ 23°21′ Sud et 43°41′ Est.",mg:"Ny latitude no milaza ny halaviran'ny toerana iray amin'ny ekoatera, mianavaratra na mianatsimo (0° ka hatramin'ny 90°). Ny longitude no milaza ny halaviran'ny toerana iray amin'ny méridien de Greenwich, miantsinanana na miankandrefana (0° ka hatramin'ny 180°). Ohatra : eo amin'ny 23°21′ Atsimo sy 43°41′ Atsinanana eo ho eo i Toliara."},
 pf:{fr:"Chaque case montre un carrefour vu d'en haut. Tu arrives toujours par le bas de la case ; la flèche rouge montre le chemin à prendre. La première case indique aussi le nord. Regarde aussi la case suivante : elle t'aide à reconnaître le bon carrefour.",mg:"Ny efajoro tsirairay dia mampiseho sampanan-dalana iray jerena avy any ambony. Avy any ambany amin'ny efajoro foana no ahatongavanao ; ny zana-tsipika mena no manondro ny lalana horaisina. Ny efajoro voalohany dia manondro ny avaratra koa. Jereo koa ny efajoro manaraka : manampy anao hahafantatra ny sampanan-dalana marina izany."},
 pfc:{fr:["Départ (avec le nord)","À gauche","Tout droit","À droite","Arrivée"],mg:["Fiaingana (misy ny avaratra)","Ankavia","Mahitsy","Ankavanana","Fahatongavana"]},
 ri:{fr:"On dessine le chemin en ligne droite, de bas en haut, avec les carrefours, l'azimut à suivre et les repères (bâtiment, forêt, pont). Celui qui suit le relevé le lit en partant du bas de la feuille.",mg:"Sarihana amin'ny tsipika mahitsy ny lalana, manomboka ambany miakatra, miaraka amin'ny sampanan-dalana, ny azimut arahina ary ny marika (trano, ala, tetezana). Izay manaraka azy dia mamaky manomboka eo ambany amin'ny taratasy."},

  }
  if (tab === "codes") body = cxView(); else if (tab === "sema") body = semView();
  return band("morse", ["alphabet", "traduire", "codes", "sema", "quiz"]) + `<div class="wrap">${body}</div>`;
}
function cCard(c) {
  const rk = st.rot[c.id] || 0;
  return `<div class="cc"><div class="sky">${constSvg(c, rk, true)}<button class="rot" data-act="rot" data-v="${c.id}">${t("rotate")}</button></div><div class="ci"><h3>${esc(L(c.n))}</h3><div class="meta"><span>${t("look")} : <b>${t(c.f)}</b></span><span>${t("when")} : <b>${esc(monthsRange(c.m))}</b></span></div><p style="margin:0 0 6px">${esc(L(c.d))}</p><div class="tip small">${esc(L(c.tip))}</div></div></div>`;
}
function ciel() {
  let body;
  const tab = st.tab.ciel, mo = new Date().getMonth();
  if (tab === "quiz") body = quizView("ciel");
  else if (tab === "sud") {
    body =`<div class="cc"><div class="sky">${southSvg()}</div><div class="ci"><h3>${t("southT")}</h3><ol style="margin:6px 0 0;padding-left:22px">${L({fr:["Repère la Croix du Sud : 4 étoiles brillantes en petite croix, avec deux pointeurs très brillants à côté.","Prolonge le grand axe (de Gacrux vers Acrux) d'environ 4 fois et demie sa longueur.","Plus précis : trace la ligne perpendiculaire au milieu des deux pointeurs. Elle croise la première près du pôle sud céleste.","Descends tout droit jusqu'à l'horizon : c'est le Sud. À Tuléar, le pôle est à environ 23° au-dessus de l'horizon (deux poings et demi, bras tendu)."],mg:["Tadiavo ny Lakroan'ny Atsimo : kintana mamirapiratra 4 manao lakroa kely, misy mpanondro roa tena mamirapiratra eo akaikiny.","Halavao in-4 sy sasany eo ho eo ny tsipika lavany (avy amin'i Gacrux mankany amin'i Acrux).","Mba ho marina kokoa : tariho ny tsipika mitsangana eo afovoan'ireo mpanondro roa. Mifanapaka amin'ny voalohany eo akaikin'ny tendrontany atsimon'ny lanitra izy.","Midina mahitsy hatrany amin'ny faravodilanitra : io no Atsimo. Eto Toliara, eo amin'ny 23° eo ho eo ambonin'ny faravodilanitra ny tendrontany (totohondry roa sy sasany, maninjitra ny sandry)."]}).map(x => `<li>${esc(x)}</li>`).join("")}</ol></div></div>`;
  } else if (tab === "toutes") body = `<p class="mut small">${esc(t("drawn"))}</p>` + CONST.map(cCard).join("");
  else {
    const now = CONST.filter(c => c.m.includes(mo)), soon = CONST.filter(c => !c.m.includes(mo) && c.m.includes((mo + 1) % 12));
    body = `<h2 style="font-size:26px;margin:2px 0 4px">${t("visibleNow")} ${t("months")[mo]}</h2><p class="mut small">${esc(t("drawn"))}</p>` + now.map(cCard).join("") + (soon.length ? `<h2 style="font-size:26px;margin:18px 0 10px">${t("soon")}</h2>` + soon.map(cCard).join("") : "");
  }
  return band("ciel", ["mois", "toutes", "sud", "quiz"]) + `<div class="wrap">${body}</div>`;
}
function signes() {
  let body;
  const tab = st.tab.signes;
  if (tab === "quiz") body = quizView("signes");
  else if (tab === "cache") body = hidView();
  else if (tab === "conseils") body = `<div class="card"><ul class="tips">${TIPS.map(x => `<li>${esc(L(x))}</li>`).join("")}</ul></div>`;
  else body = `<div class="card note small">${esc(t("signsNote"))}</div><div class="sgrid">${SIGNS.map(s => `<div class="sg"><div class="board"><svg viewBox="0 0 100 100" role="img" aria-label="${esc(L(s.n))}">${s.v}</svg></div><div class="si"><h3>${esc(L(s.n))}</h3><p>${esc(L(s.d))}</p></div></div>`).join("")}</div>`;
  return band("signes", ["liste", "cache", "conseils", "quiz"]) + `<div class="wrap">${body}</div>`;
}
const VIEWS = {home, formation, morse, ciel, signes, j2300, pba, bible, cg, c28, nd, or, info};

function render() {
  document.documentElement.lang = lang === "mg" ? "mg" : "fr";
  const r = st.route;
  app.style.setProperty("--sec", COL[r]);
  const top = `<div class="top">${r === "home" ? `<button class="ib" data-go="info" aria-label="${t("info")}"><svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="10" fill="none" stroke="#fff" stroke-width="2"/><path d="M12 10.5V17M12 7.3v.1" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg></button><span class="ttl cond">Tahiry Lesona MJA</span>` : `${r === "nd" && st.ndSel ? `<button class="ib" data-act="ndb" aria-label="${t("back")}">‹</button>` : `<button class="ib" data-go="${r === "bible" && st.rdFrom ? st.rdFrom : "home"}" aria-label="${t("back")}">‹</button>`}<span class="ttl cond">${S[lang][r + "S"] ? t(r + "S") : t(r)}</span>`}<div class="lang" role="group" aria-label="Langue / Fiteny"><button data-act="lang" data-v="fr" aria-pressed="${lang === "fr"}">FR</button><button data-act="lang" data-v="mg" aria-pressed="${lang === "mg"}">MG</button></div></div>`;
  app.innerHTML = top + VIEWS[r]();
  const tin = $("#tin"), min = $("#min"), w = $("#wpm");
  if (tin) tin.addEventListener("input", () => { st.txt = tin.value; $("#res").textContent = show(toMorse(st.txt)) || " "; });
  if (min) min.addEventListener("input", () => { st.mtx = min.value; $("#res").textContent = fromMorse(st.mtx) || " "; });
  if (w) w.addEventListener("input", () => { wpm = +w.value; $("#wv").textContent = wpm; save("wpm", wpm); });
  const sf = $("#sf");
  if (sf) sf.addEventListener("submit", e => { e.preventDefault(); st.sq = $("#bq").value; const a2 = document.activeElement; if (a2 && a2.blur) a2.blur(); render(); });
  ndAfter();
  if (r === "c28" && st.c28scroll) { st.c28scroll = false; const el = document.getElementById("c28-" + st.c28o); if (el) el.scrollIntoView({block: "start"}); }
  if (r === "bible" && st.rdView === "read" && st.rdHl) { const el = document.getElementById("v" + st.rdHl); if (el) el.scrollIntoView({block: "center"}); }
}
function go(r) { stopPlay(); ndStop(); if (r !== "nd") st.ndSel = null; if (st.route === "bible" && r !== "bible") { st.rdFrom = null; st.rdDay = null; st.rdView = "read"; st.backSearch = false; } if (location.hash.slice(1) !== (r === "home" ? "" : r)) location.hash = r === "home" ? "" : r; else { st.route = r; render(); window.scrollTo(0, 0); } }
function route() { const h = location.hash.slice(1); st.route = VIEWS[h] && h !== "home" ? h : "home"; stopPlay(); window.scrollTo(0, 0); render(); }
window.addEventListener("hashchange", route);

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { go(g.dataset.go); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === "lang") { lang = v; save("lang", v); render(); }
  else if (a.startsWith("cg")) cgAct(a, b);
  else if (a === "ordir") orAct(a, b);
  else if (/^(cx|sem[rn]$|gocx$)/.test(a)) cxAct(a, b);
  else if (/^nd[a-z]$/.test(a)) ndAct(a, b);
  else if (a === "c28go") { st.c28o = +b.dataset.n; st.c28scroll = true; st.tab.c28 = "c28l"; render(); }
  else if (a === "c28s") { const D = c28Done(), n = +b.dataset.n; if (D.has(n)) D.delete(n); else D.add(n); save("c28d", JSON.stringify([...D])); st.c28o = n; render(); }
  else if (a === "ref") { const r = parseRef((b.dataset.r || "").replace(/-\d+$/, "")); if (r) { st.rd = {v: curV(), b: r.b, c: r.c}; st.rdHl = r.v || null; st.rdView = "read"; saveRd(); st.rdFrom = st.route; st.rdDay = null; go("bible"); } }
  else if (a === "tab") { const k = st.route, was = k === "nd" && st.ndSel; if (was) { ndStop(); st.ndSel = null; } if (st.tab[k] !== v) { st.tab[k] = v; if (Q && Q.key === k && v !== "quiz") Q = null; stopPlay(); render(); } else if (was) render(); }
  else if (a === "cat") { st.cat = v; render(); }
  else if (a === "gosouth") { st.tab.ciel = "sud"; go("ciel"); }
  else if (a === "pl") playCode(MORSE[v]);
  else if (a === "sos") playCode("...---...", false);
  else if (a === "soslamp") playCode("...---...", true);
  else if (a === "dir") { st.dir = v; render(); }
  else if (a === "k") {
    let s = st.mtx;
    if (v === "bs") s = /\s*\/\s*$/.test(s) ? s.replace(/\s*\/\s*$/, "") : /\s$/.test(s) ? s.replace(/\s+$/, "") : s.slice(0, -1);
    else if (v === "clr") s = "";
    else s += v;
    st.mtx = s; const m = $("#min"); if (m) m.value = s; $("#res").textContent = fromMorse(s) || " ";
  }
  else if (a === "tplay" || a === "tlamp") playCode(st.dir === "t2m" ? toMorse(st.txt) : st.mtx.replace(/[·•∙*]/g, ".").replace(/[—–−_]/g, "-"), a === "tlamp");
  else if (a === "tcopy") copy(st.dir === "t2m" ? show(toMorse(st.txt)) : fromMorse(st.mtx));
  else if (a === "open") { st.rdHl = null; st.rd = {v: curV(), b: +b.dataset.b, c: +b.dataset.c}; st.rdView = "read"; saveRd(); st.rdFrom = "pba"; st.rdDay = +b.dataset.d; go("bible"); }
  else if (a === "rsearch") { st.rdView = st.rdView === "search" ? "read" : "search"; render(); window.scrollTo(0, 0); const q = $("#bq"); if (q && !st.sq) q.focus(); }
  else if (a === "ss") { st.ss = v; render(); }
  else if (a === "rgo") { st.backSearch = st.route === "bible" && st.rdView === "search"; st.rd = {v: st.route === "bible" ? st.rd.v : curV(), b: +b.dataset.b, c: +b.dataset.c}; st.rdHl = +b.dataset.v || null; st.rdView = "read"; saveRd(); if (st.route === "bible") { render(); } else { st.rdFrom = st.route === "home" ? null : st.route; st.rdDay = null; go("bible"); } }
  else if (a === "vcopy") { const x = votdItem(), vv = curV(); copy(`« ${vv === "mg" ? x[3] : x[4]} » ${bnameV(x[0], vv)} ${x[1]}:${x[2]}`); }
  else if (a === "rbooks") { st.rdView = st.rdView === "read" ? "books" : "read"; render(); window.scrollTo(0, 0); }
  else if (a === "rb") { st.rdHl = null; st.rd.b = +v; st.rd.c = 1; st.rdView = "chaps"; saveRd(); render(); window.scrollTo(0, 0); }
  else if (a === "rc") { st.rdHl = null; st.rd.c = +v; st.rdView = "read"; saveRd(); render(); window.scrollTo(0, 0); }
  else if (a === "rv") { st.rd.v = v; save("bv", v); saveRd(); render(); }
  else if (a === "rstep") { const n = window.BIB && window.BIB[st.rd.v] ? stepCh(st.rd, +v) : null; if (n) { st.rdHl = null; st.rd.b = n.b; st.rd.c = n.c; saveRd(); render(); window.scrollTo(0, 0); } }
  else if (a === "fs") { st.fs = st.fs >= 24 ? 16 : st.fs + 2; save("fs", st.fs); render(); toast(st.fs + " px"); }
  else if (a === "pbtog") { const i = +b.dataset.i; if (pbDone.has(i)) pbDone.delete(i); else pbDone.add(i); pbSave(); render(); }
  else if (a === "pbm") { st.pbm = +v; render(); }
  else if (a === "pbgo") { st.pbm = +b.dataset.m; st.tab.pba = "cal"; render(); window.scrollTo(0, 0); }
  else if (a === "bv") { save("bv", v); st.rd.v = v; saveRd(); render(); }
  else if (a === "pbstart") { save("pbas." + pbYear, pbToday().idx); render(); }
  else if (a === "pbreset1") { st.pbReset = true; render(); }
  else if (a === "pbreset0") { st.pbReset = false; render(); }
  else if (a === "pbreset2") { pbDone = new Set(); pbSave(); save("pbas." + pbYear, 0); st.pbReset = false; render(); }
  else if (a === "rot") { st.rot[v] = ((st.rot[v] || 0) + 1) % 4; render(); }
  else if (a === "mm") { st.mm = v; save("mm", v); render(); }
  else if (a === "ml") { st.ml = v; save("ml", v); render(); }
  else if (a === "qstart") startQuiz(b.dataset.k);
  else if (a === "qquit") { Q = null; st.tab[st.route] = FIRST[st.route]; render(); }
  else if (a === "qplay") { if (Q) playCode(Q.items[Q.i].code); }
  else if (a === "qpick") {
    if (!Q || Q.picked !== null) return;
    Q.picked = +b.dataset.i; if (Q.picked === Q.items[Q.i].ans) Q.score++;
    render();
  }
  else if (a === "qnext") {
    if (!Q) return;
    Q.i++; Q.picked = null;
    if (Q.i >= Q.items.length) { const prev = +load("best." + Q.key, -1); if (Q.score > prev) save("best." + Q.key, Q.score); }
    render(); window.scrollTo(0, 0);
    if (Q.key === "morse" && st.mm === "listen" && Q.i < Q.items.length) playCode(Q.items[Q.i].code);
  }
});

/* bouton Retour d'Android : 1 = géré par l'appli, 0 = quitter */
window.appBack = () => { if (lampEl.classList.contains("on")) { stopPlay(); return 1; } if (st.route === "nd" && st.ndSel) { ndStop(); st.ndBack = st.ndSel; st.ndSel = null; render(); return 1; } if (st.route === "bible" && st.rdView === "read" && st.backSearch) { st.backSearch = false; st.rdView = "search"; render(); return 1; } if (st.route === "bible" && st.rdView !== "read") { st.rdView = "read"; render(); return 1; } if (st.route !== "home") { go(st.route === "bible" && st.rdFrom ? st.rdFrom : "home"); return 1; } return 0; };

route();
}
</script>
</body>
</html>
