      - name: Icône et page de l'appli
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/assets
          cp icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp index.html android/app/src/main/assets/index.html
          for f in bible-mg.js bible-fr.js; do
            if [ -f "$f" ]; then cp "$f" android/app/src/main/assets/; else echo "ATTENTION : $f absent du depot"; fi
          done

      - name: Fabriquer l'APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk tahiry-lesona-mja.apk

      - name: Garder l'APK dans les résultats
        uses: actions/upload-artifact@v4
        with:
          name: tahiry-lesona-mja-apk
          path: tahiry-lesona-mja.apk

      - name: Publier l'APK (page Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Tahiry Lesona MJA v${{ github.run_number }}
          body: APK de l'appli Tahiry Lesona MJA. Télécharge tahiry-lesona-mja.apk et installe-le (elle remplace l'appli Explorateur).
          files: tahiry-lesona-mja.apk
          make_latest: true
